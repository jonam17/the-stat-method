evidence:
  established: >-
    Healthy blood and nerves. For adults, the official values were set mainly at the amount needed to maintain
    healthy blood cell status and serum vitamin B12 levels, and enough vitamin B12 prevents the anemia and nerve
    damage of deficiency [1].
  notSupported: >-
    Heart disease: supplements lower homocysteine, but a Cochrane review of 15 studies in 71,422 people concluded
    that vitamin B12, alone or with other B vitamins, does not prevent heart attacks or reduce deaths in people
    with or at risk of cardiovascular disease [2]. Cognition: in a trial of 2,919 adults aged 65 and older given
    500 mcg of vitamin B12 and 400 mcg of folic acid a day or a placebo for 2 years, homocysteine fell but
    cognitive test scores did not differ [3], and a Cochrane review of 14 studies in 27,882 mostly older people
    found little to no effect on overall cognitive function [1]. Cancer: a meta-analysis of 18 trials in 74,498
    people found that B-vitamin supplements including 20 to 2,000 mcg of vitamin B12 a day had little or no
    effect on cancer incidence, cancer deaths or overall mortality [4]. Energy: although it is often promoted as
    an energy and endurance booster, vitamin B12 appears to do nothing for athletic performance in people who are
    not deficient [1].
  mixed: >-
    Whether vitamin B12 status affects cancer risk is unclear. Some observational studies link high blood
    levels, or long-term use of at least 55 mcg a day from supplements, with more cancer — in one study, lung
    cancer in men; others link low levels with more gastric, colorectal or prostate cancer; and others find no
    link at all [1]. Some studies have found associations between low vitamin B12 and depression [1].

tooMuch: >-
  No upper limit has been set: the Food and Nutrition Board judged vitamin B12's potential for toxicity to be
  low, and even large doses are generally considered safe because the body does not store the excess [1]. That
  is a statement about safety, not benefit — see the evidence above, including the unresolved observational
  links between high levels and some cancers [1].

interactions: >-
  Proton pump inhibitors such as omeprazole and lansoprazole, and H2 blockers such as cimetidine, reduce
  stomach acid and can interfere with absorbing vitamin B12 from food, leading to deficiency. Metformin, used
  for prediabetes and diabetes, might reduce absorption and significantly lower blood levels [1]. If you take
  any of these regularly, talk to your doctor or pharmacist about your vitamin B12 status.

