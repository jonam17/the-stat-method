# Vitamin B12 — every value from the NIH Office of Dietary Supplements Health
# Professional fact sheet (reference 1), updated 2 Jul 2025. Numbered markers
# [n] refer to `references` below. Follow docs/LIBRARY-WORKFLOW.md.
# DRAFT until a person has checked every value against the source.
#
# The fact sheet's "19+ years" row covers all three adult brackets.
draft: false
name: Vitamin B12
kind: vitamin
dek: A vitamin found naturally only in animal foods, needed for nerves, red blood cells and DNA. Absorbing it depends on stomach acid and a protein the stomach makes.
unit: mcg

intake:
  type: RDA
  rows:
    - { group: "19–50", male: 2.4, female: 2.4, pregnancy: 2.6, lactation: 2.8 }
    - { group: "51–70", male: 2.4, female: 2.4 }
    - { group: ">70", male: 2.4, female: 2.4 }
  eighteenNote: People aged 18 fall in the official 14–18 group, which has the same values — 2.4 mcg a day, 2.6 mcg in pregnancy and 2.8 mcg when breastfeeding.

# No UL: "The FNB did not establish a UL for vitamin B12 because of its low
# potential for toxicity." So no rows and no appliesTo.
ul:
  note: No upper limit has been set for vitamin B12, because its potential for toxicity is low. That does not make large doses useful — most of a large dose is not absorbed.

does: >-
  Vitamin B12 is needed for the development, myelination and function of the central nervous system, for
  healthy red blood cells and for making DNA [1]. Compounds with vitamin B12 activity are called cobalamins,
  because the vitamin contains the mineral cobalt [1]. The body stores about 1 to 5 mg — 1,000 to 2,000 times
  as much as a person typically eats in a day — which is why deficiency can take several years to show [1].

forms: >-
  Methylcobalamin and 5-deoxyadenosylcobalamin are the forms the body uses; cyanocobalamin and
  hydroxycobalamin become active once converted to them [1]. Most supplements contain cyanocobalamin, and others
  use adenosylcobalamin, methylcobalamin or hydroxycobalamin; no evidence indicates that absorption differs by
  form [1]. Tablets or lozenges dissolved under the tongue appear no more effective than those swallowed [1].
  Injections and a nasal gel are prescription medicines, used mainly to treat deficiency [1].

absorption: >-
  In food, vitamin B12 is bound to protein. Stomach acid and enzymes release it, and it is then absorbed
  together with intrinsic factor, a protein made by the stomach [1]. The vitamin added to fortified foods and
  supplements is already free, so it does not need that release step [1]. Absorption drops steeply once a dose
  exceeds what intrinsic factor can carry, about 1 to 2 mcg: around half of a small dose is absorbed, but only
  about 2% of 500 mcg and 1.3% of 1,000 mcg [1]. Vitamin B12 from dairy appears to be about three times as
  available as from meat, fish and poultry, and from supplements about 50% more available than from food [1].

pairing:
  heading: What about folic acid?
  text: >-
    Vitamin B12 is often sold in B-complex supplements alongside other B vitamins, usually in larger amounts
    than in multivitamins [1], and several of the trials described below gave it with folic acid. The idea is
    that together they lower homocysteine, a compound associated with heart disease and dementia. They do lower
    it — but in those trials, that did not translate into fewer heart attacks or better cognitive function [2][3].
    The combination may also carry risks. In U.S. survey data on adults aged 60 and older, low vitamin B12
    status together with high folic acid or folate was associated with about two to three times the risk of
    cognitive impairment — a cross-sectional finding that cannot show cause [6]. In a trial of 400 mcg of folic
    acid and 500 mcg of vitamin B12 a day for 2 to 3 years, colorectal cancer was more common in the supplement
    group (3.4% against 2%), although this might have been due to the folic acid rather than the vitamin B12,
    and overall cancer risk did not differ [5].

deficiency: >-
  Causes include difficulty absorbing the vitamin from food, lack of intrinsic factor (as in pernicious
  anemia), stomach or intestinal surgery, long-term use of some medicines, and a diet without it [1]. The
  hallmark is megaloblastic anemia — large, abnormal red blood cells — along with low blood counts, an inflamed
  tongue, fatigue, palpitations, pale skin, dementia, weight loss and infertility [1]. Numbness and tingling in
  the hands and feet can occur without anemia, so early diagnosis matters to avoid irreversible damage [1]. In
  pregnant and breastfeeding women, deficiency might cause neural tube defects, developmental delays, failure
  to thrive and anemia in the baby [1]. Blood levels below 200 or 250 pg/mL are generally considered low, and
  methylmalonic acid is the most sensitive marker [1]. Deficiency is usually treated with injections; in three
  small trials, very high oral doses (1,000 to 2,000 mcg) normalised blood levels about as well, though the
  evidence was of low quality [7].

atRisk:
  - Older adults — between 3% and 43% of older adults living in the community are deficient, depending on the definition used; atrophic gastritis, which reduces stomach acid and intrinsic factor, affects 8% to 9% of adults 65 and older [1]
  - People with pernicious anemia, an autoimmune disease that stops the stomach making intrinsic factor and the most common cause of clinically evident deficiency worldwide [1]
  - People with celiac disease, who have higher rates of deficiency; for Crohn's disease the evidence is mixed [1]
  - People who have had stomach or intestinal surgery, including weight-loss surgery, which removes cells that make stomach acid and intrinsic factor [1]
  - Vegans and vegetarians, because natural sources are limited to animal foods; fortified foods and supplements substantially reduce the risk [1]

usIntake: >-
  Most people in the United States get enough vitamin B12 [1]. In national survey data from 2017 to March
  2020, men aged 20 and older averaged 5.84 mcg a day from food and drink and women 3.69 mcg; only 5% of men
  and 11% of women fell below the average requirement of 2 mcg [1]. About 24% of men and 29% of women take a
  supplement containing it [1]. Even so, in 2007–2018 data about 3.6% of adults had vitamin B12 deficiency
  (blood levels below 200 pg/mL) and about 12.5% had insufficiency (below 300 pg/mL) [1]. People of low
  socioeconomic status, women and non-Hispanic Black Americans are the most likely to have low intakes [1].

