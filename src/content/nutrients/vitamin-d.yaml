evidence:
  established: >-
    Bone health and normal calcium metabolism. The official values were set to maintain them [2], and the
    committee that set them found the evidence inadequate or too contradictory to conclude that vitamin
    D affects any other outcome [1]. A later government review of nearly 250 studies reached the same
    conclusion [1].
  notSupported: >-
    In VITAL, a U.S. trial in which 25,871 adults aged 50 and over took 50 mcg (2,000 IU) a day or a
    placebo for a median of 5.3 years, rates of breast, prostate and colorectal cancer did not differ, and
    heart attacks, strokes and cardiovascular deaths were not significantly reduced; fracture risk was not
    lowered and depression was not prevented [1]. The U.S. Preventive Services Task Force concluded with
    moderate certainty that supplements do not reduce falls in community-dwelling adults 65 and older [1].
    In a trial of 2,423 adults with prediabetes given 100 mcg (4,000 IU) a day, supplements did not
    significantly prevent diabetes [1]. They do not promote weight loss [1].
  mixed: >-
    Meta-analyses of trials find that supplements do not change how many people develop cancer, but may
    reduce cancer deaths by 12% to 13% [1]. In older adults, vitamin D with calcium slightly increases bone
    density and reduces fractures in people living in care institutions, while results for people living
    independently are inconsistent [1].

disagreements: >-
  The United Kingdom recommends 10 mcg (400 IU) a day for everyone aged 4 and over, less than the U.S.
  figure [3]. The Endocrine Society recommends routine supplements for children and teenagers, pregnant
  women, adults with prediabetes and adults 75 and older — but not for healthy adults aged 19 to 74 — while
  advising that everyone meet the U.S. recommended amount [4]. A peer-reviewed analysis argues the U.S.
  recommended amount rests on a statistical error and should be reconsidered [5]. The NIH attributes such
  differences to an incomplete understanding of vitamin D's biology and to guidelines written for
  different purposes [1].

tooMuch: >-
  Too much vitamin D raises blood calcium, which can cause nausea, vomiting, muscle weakness, confusion,
  excessive thirst and kidney stones; in extreme cases it leads to kidney failure, calcium deposits in
  soft tissue, irregular heart rhythm and death [1]. It almost always comes from supplements — the sun
  cannot cause it, though frequent tanning-bed use can drive levels very high [1]. The National
  Academies' committee noted that symptoms are unlikely below 250 mcg (10,000 IU) a day, but that
  intakes below the upper limit may still have adverse effects over time [1].

interactions: >-
  The weight-loss drug orlistat reduces vitamin D absorption. Statins may reduce the body's own vitamin D
  production, and high intakes of vitamin D may make atorvastatin, lovastatin and simvastatin less
  effective. Corticosteroids such as prednisone impair vitamin D metabolism, and thiazide diuretics taken
  with vitamin D can raise blood calcium too high, especially in older adults [1]. If you take any of these
  regularly, talk to your doctor or pharmacist before taking a vitamin D supplement.

