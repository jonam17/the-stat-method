draft: true
name: Vitamin D
kind: vitamin
dek: A fat-soluble vitamin that lets the gut absorb calcium. Very few foods contain it naturally, and the skin makes it — as vitamin D3 — from sunlight.
unit: mcg
altUnit: { unit: IU, perUnit: 40 }

intake:
  type: RDA
  rows:
    - { group: "19–50", male: 15, female: 15, pregnancy: 15, lactation: 15 }
    - { group: "51–70", male: 15, female: 15 }
    - { group: ">70", male: 20, female: 20 }
  eighteenNote: People aged 18 fall in the official 14–18 group, which has the same values — 15 mcg (600 IU) a day, with an upper limit of 100 mcg (4,000 IU).

ul:
  rows:
    - { group: "19–50", male: 100, female: 100, pregnancy: 100, lactation: 100 }
    - { group: "51–70", male: 100, female: 100 }
    - { group: ">70", male: 100, female: 100 }
  appliesTo: total
  note: The upper limit covers vitamin D from food, drink and supplements combined. It is the most that is unlikely to cause harm, not a target.

does: >-
  Vitamin D helps the gut absorb calcium and keeps blood calcium and phosphate at the levels bones
  need to mineralise; without enough, bones can become thin, brittle or misshapen [1]. In adults,
  enough vitamin D prevents osteomalacia, and together with calcium it helps protect older adults
  from osteoporosis [1]. The skin makes vitamin D3 when ultraviolet B light strikes it — though not
  through a window, because glass blocks those rays [1].

forms: >-
  In food and supplements, vitamin D comes in two main forms: D2 (ergocalciferol) and D3
  (cholecalciferol), which differ chemically only in one side chain [1]. The skin makes D3 [1].
  Animal foods — including fish, egg yolks and cheese — provide mainly D3, along with a related
  compound, 25-hydroxyvitamin D3; mushrooms provide D2, and some are treated with UV light to raise
  it [1]. Supplements can contain either form [6]. Both raise the amount of vitamin D in the blood,
  but D3 may raise it higher and keep it there longer than D2 [6].

absorption: >-
  Because vitamin D dissolves in fat, eating some fat at the same time improves how much is
  absorbed, although some is absorbed even without it [1]. The NIH advises taking a supplement with
  a meal or snack that contains some fat [6]. Neither age nor obesity changes how well the gut
  absorbs vitamin D [1], but conditions that limit fat absorption — such as Crohn's disease, celiac
  disease and ulcerative colitis — reduce it [6].

pairing:
  heading: What about vitamin K?
  text: >-
    Vitamin D3 is often sold together with vitamin K2. The claim made for the pairing is not that K2
    helps you absorb vitamin D, but that it helps direct calcium into bone. The evidence is limited: a
    review describes a meta-analysis of 16 trials in postmenopausal women in which K2 improved spine
    bone density in 10, but in subgroup analysis only K2 combined with other treatments had a
    significant effect — and many studies used high, pharmacological doses [7]. Another review called
    the evidence promising but still inconclusive [8]. One risk matters more than any benefit: vitamin
    K can interact seriously and dangerously with blood thinners such as warfarin (Coumadin), and
    people taking them need to keep their vitamin K intake consistent [9]. If you take a blood thinner,
    talk to your doctor before taking any supplement that contains vitamin K.

deficiency: >-
  In adults, long-term deficiency causes osteomalacia, in which bone is poorly mineralised and
  weakens, bringing bone pain and deformity [1]. Status is judged by a blood test for
  25-hydroxyvitamin D. The National Academies' committee put the risk of deficiency below 30 nmol/L
  (12 ng/mL) and considered 50 nmol/L (20 ng/mL) or more sufficient for most people [1]. The U.S.
  Preventive Services Task Force found insufficient evidence to assess screening adults who have no
  symptoms [1].

atRisk:
  - Older adults — the skin makes less vitamin D with age, and many spend more time indoors [1]
  - People with limited sun exposure, including the homebound and those whose clothing or work keeps skin covered [1]
  - People with darker skin, which makes less vitamin D from sunlight; whether the lower blood levels harm health is not clear [1]
  - People with conditions that limit fat absorption, such as Crohn's disease, celiac disease or cystic fibrosis [1]
  - People with obesity or who have had gastric bypass surgery [1]

usIntake: >-
  Most people in the United States get less than the recommended amount from food: in national
  survey data from 2015–2016, average intake from food and drink was 5.1 mcg (204 IU) a day for men
  and 4.2 mcg (168 IU) for women [1]. Blood levels are better than intake suggests, largely because of
  sun exposure — in 2011–2014 data, 18% of people were at risk of inadequacy and 5% at risk of
  deficiency [1]. Fortified foods supply most of the vitamin D in American diets; almost all U.S. milk
  is voluntarily fortified with about 3 mcg (120 IU) per cup [1].

sources:
  rule: The five foods with the most vitamin D per serving in the NIH fact sheet's food table. Fortified foods are marked. Fish liver oils, which are sold and used like supplements, are left out.
