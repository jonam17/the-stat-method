ul:
  rows:
    - { group: "19–50", male: 1000, female: 1000, pregnancy: 1000, lactation: 1000 }
    - { group: "51–70", male: 1000, female: 1000 }
    - { group: ">70", male: 1000, female: 1000 }
  appliesTo: supplemental
  scope: This limit applies only to folic acid and other synthetic forms of folate from supplements and fortified foods — not to folate found naturally in food.
  note: The limit is the most folic acid from supplements and fortified foods a day that is unlikely to cause harm, not a target. It is in plain mcg, not mcg DFE like the recommended amount — 1,000 mcg of folic acid equals 1,667 mcg DFE. It was set because of the way folate interacts with vitamin B12; no limit was set for folate from food, because high intakes from food have not been reported to cause harm. It does not apply to people taking high doses under medical supervision.

does: >-
  Folate, sometimes called vitamin B9, is a water-soluble B vitamin [1]. It works as a coenzyme in making
  DNA and RNA and in the metabolism of amino acids, including the conversion of homocysteine to methionine
  [1]. One folate-dependent step in making DNA is required for proper cell division; when it fails, the
  result can be megaloblastic anemia, a hallmark of folate deficiency [1]. The body holds about 15 to 30 mg
  of folate, about half of it in the liver [1].

forms: >-
  Folate is the general term for the folates found naturally in food and the forms in supplements and
  fortified foods [1]. Folic acid is the form used in fortified foods and most supplements; some supplements
  contain 5-MTHF (also sold as L-methylfolate) instead [1]. At least 85% of folic acid is absorbed when taken
  with food, and nearly 100% on an empty stomach, against about 50% of the folate naturally present in food
  [1]. 5-MTHF is absorbed as well as folic acid or better, but no official factor for converting it to DFE
  has been set [1]. Common supplement amounts for adults are 680 to 1,360 mcg DFE (400 to 800 mcg folic acid)
  [1].

deficiency: >-
  Isolated folate deficiency is uncommon; it usually comes with other deficiencies, because it is closely
  linked with poor diet, alcohol use disorder and malabsorption [1]. Its main sign is megaloblastic anemia,
  with weakness, fatigue, difficulty concentrating, irritability, headache, heart palpitations and shortness
  of breath [1]. It can also cause soreness and shallow ulcers on the tongue and inside the mouth; changes in
  skin, hair or fingernail colour; digestive symptoms; and raised blood homocysteine [1]. Women with too
  little folate are at greater risk of having a baby with a neural tube defect [1]. A serum folate above 3
  ng/mL, or a red blood cell folate above 140 ng/mL, indicates adequate status [1].

atRisk:
  - People with alcohol use disorder — diets are often poor, and alcohol interferes with folate absorption and speeds its breakdown and excretion [1]
  - Women who could become pregnant — some get too little even when they take supplements [1]
  - Pregnant women, whose recommended amount rises from 400 to 600 mcg DFE, which can be hard to reach through diet alone [1]
  - People with malabsorptive disorders such as tropical sprue, celiac disease and inflammatory bowel disease, or with reduced stomach acid [1]
  - People with the 677C>T variant of the MTHFR gene, who convert folate to its active form less efficiently — about 25% of Hispanics, 10% of Caucasians and Asians, and 1% of African Americans carry two copies [1]

usIntake: >-
  Most Americans get enough folate: in national survey data from 2013–2014, average intake from food was 602
  mcg DFE a day for men aged 20 and older and 455 mcg DFE for women [1]. Some groups still fall short — even
  counting supplements, 17% of women aged 19 to 30 and 23% of non-Hispanic black women do not meet the
  average requirement [1]. Since 1998 the FDA has required folic acid to be added to enriched breads,
  cereals, flours, corn meals, pastas, rice and other grain products, which raised average folic acid
  intake by about 190 mcg a day [1]. About 35% of adults take a supplement containing folic acid, and about
  5% of adults aged 51 to 70 and of men 71 and older take in more than the upper limit, mainly from
  supplements [1].

