draft: false
name: Folate
kind: vitamin
dek: A B vitamin needed to make DNA and for cell division. Folate occurs naturally in food; folic acid is the form added to fortified foods and most supplements.
unit: mcg

intake:
  type: RDA
  unitLabel: mcg DFE
  rows:
    - { group: "19–50", male: 400, female: 400, pregnancy: 600, lactation: 500 }
    - { group: "51–70", male: 400, female: 400 }
    - { group: ">70", male: 400, female: 400 }
  note: Amounts are in dietary folate equivalents (DFE), which allow for folic acid being better absorbed than the folate in food — 1 mcg DFE is 1 mcg of food folate, 0.6 mcg of folic acid from fortified foods or from supplements taken with food, or 0.5 mcg of folic acid from a supplement taken on an empty stomach. Separately, the Food and Nutrition Board advises everyone who could become pregnant to get 400 mcg of folic acid a day from supplements, fortified foods or both, on top of the folate in a varied diet.
  eighteenNote: People aged 18 fall in the official 14–18 group, which has the same values — 400 mcg DFE a day, 600 mcg DFE in pregnancy and 500 mcg DFE when breastfeeding. Its upper limit is lower, at 800 mcg of folic acid from supplements and fortified foods.

