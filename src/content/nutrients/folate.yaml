evidence:
  established: >-
    Neural tube defects. Trial evidence shows that enough folic acid around conception prevents a
    substantial share of neural tube defects, and since mandatory fortification began in 1998, U.S. rates
    have fallen by 28% [1]. Folate is also essential for making DNA, which is why the recommended amount
    rises in pregnancy [1].
  notSupported: >-
    Heart disease: folic acid lowers homocysteine but does not reduce the risk of heart attacks or other
    cardiovascular outcomes apart from stroke — in one trial, 5,442 U.S. women aged 42 or older at high risk
    of cardiovascular disease who took 2,500 mcg folic acid with vitamins B12 and B6 a day for 7.3 years had
    no fewer major cardiovascular events [1]. Cognition: most trials find no effect on cognitive function or
    dementia even as homocysteine falls; a meta-analysis of 11 trials in more than 20,000 older adults found
    no effect on cognitive ageing [1]. Cancer prevention: a 2015 expert panel convened by the National
    Toxicology Program and the NIH Office of Dietary Supplements concluded that folic acid supplements do not
    reduce cancer risk in people whose folate status is already adequate [1].
  mixed: >-
    Stroke: folic acid, alone or with other B vitamins, reduces stroke risk, especially where folate status
    is low. In a trial in 20,702 adults with high blood pressure in regions of China without fortification,
    800 mcg a day with the blood pressure drug enalapril for a median of 4.5 years cut strokes by 21%
    compared with enalapril alone; the fact sheet suggests the benefit is mainly for people with too little
    folate, which is less common in fortified countries such as the United States [1]. Cancer risk at high
    doses: some trials have found more cancers with folic acid — a meta-analysis of six trials in 25,738 men
    found 24% more prostate cancer — and the fact sheet calls its effect on cancer unclear [1]. Autism:
    observational studies suggest a possible link between folic acid around conception and lower risk, but
    confounding prevents firm conclusions [1]. Depression: results are mixed, and many doses studied exceed
    the upper limit and should be taken only under medical supervision [1].

disagreements: >-
  For anyone who could become pregnant, the Food and Nutrition Board advises 400 mcg of folic acid a day from
  supplements, fortified foods or both [1]. The U.S. Preventive Services Task Force recommends a daily
  supplement of 400 to 800 mcg folic acid, starting at least 1 month before conception and continuing
  through the first 2 to 3 months of pregnancy [1]. The CDC recommends folic acid rather than 5-MTHF, even for
  people with the MTHFR variant [1]. The Food and Nutrition Board has made no recommendation for women who have
  had a pregnancy affected by a neural tube defect; other experts recommend 4,000 to 5,000 mcg a day, which
  exceeds the upper limit and should be taken only under medical supervision [1].

tooMuch: >-
  Large amounts of folate can correct the anemia caused by vitamin B12 deficiency but not its nerve damage,
  so high intakes from supplements might hide a B12 deficiency until the damage is irreversible; concern has
  since shifted to the possibility that large amounts worsen the anemia and cognitive symptoms of B12
  deficiency [1]. High folic acid intakes might speed the progression of precancerous lesions, raising the
  risk of colorectal and possibly other cancers in some people [1]. Intakes of 1,000 mcg or more a day from
  supplements around conception have been linked to lower scores on tests of cognitive development in
  children at age 4 to 5 [1]. Folic acid beyond what the body can process circulates unmetabolised; single
  doses of 300 or 400 mcg produce detectable levels, and what that means for health is not well understood
  [1]. Folate from food has not been reported to cause harm [1].

interactions: >-
  Methotrexate, used to treat cancer and autoimmune diseases, works against folate: people taking it for
  cancer should consult their oncologist before taking folate supplements, although supplements might reduce
  the digestive side effects of low-dose methotrexate for rheumatoid arthritis or psoriasis [1]. Antiepileptic
  drugs such as phenytoin (Dilantin), carbamazepine and valproate can lower blood folate, and folate
  supplements might lower blood levels of these drugs [1]. Sulfasalazine (Azulfidine), used mainly for
  ulcerative colitis, blocks folate absorption and can cause deficiency [1]. If you take any of these
  regularly, talk to your doctor or pharmacist before taking a folate supplement.

