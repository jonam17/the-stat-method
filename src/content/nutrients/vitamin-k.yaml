evidence:
  established: >-
    Blood clotting. Vitamin K is needed to make prothrombin and other clotting proteins, and the only
    clinically significant measure of vitamin K status is prothrombin time [1]. To prevent vitamin K
    deficiency bleeding in newborns, the American Academy of Pediatrics recommends a single dose at birth
    [1].
  notSupported: >-
    Bone density in older adults: trials since 2006 have found that vitamin K supplements did not change bone
    density in elderly men or women. In one, 381 postmenopausal women took 1 mg phylloquinone, 45 mg MK-4 or a
    placebo a day for 12 months, all with calcium and vitamin D; both forms lowered undercarboxylated
    osteocalcin, but bone density at the spine and hip did not differ [1].
  mixed: >-
    Fractures: a 2006 review of 13 trials, mostly in postmenopausal women in Japan, found that 12 improved
    bone density, and in the seven with fracture data — all using MK-4 at pharmacological doses of 15 or 45 mg
    a day — fractures of the hip, spine and other bones were reduced [1]. A later trial found that 180 mcg of
    MK-7 a day for 3 years improved bone strength in postmenopausal women [1]. Whether any form reduces the
    risk of osteoporosis is unclear; giving vitamin D or calcium alongside vitamin K may explain some positive
    results [1]. Heart disease: in Dutch observational studies, higher menaquinone intake — but not
    phylloquinone — was linked to less arterial calcification, and in 4,807 adults aged 55 and older, to 57%
    lower coronary heart disease mortality in the highest third of intake [1]. In a trial of 388 healthy adults
    aged 60–80 given 500 mcg phylloquinone a day for 3 years, coronary calcification did not differ overall,
    but progressed less among the 295 who took the supplements as directed; the authors called for larger
    studies [1].

disagreements: >-
  The European Food Safety Authority has approved a health claim that "a cause and effect relationship has
  been established between the dietary intake of vitamin K and the maintenance of normal bone" [1]. The FDA
  has not authorised a health claim for vitamin K in the United States [1]. In Japan and other parts of Asia,
  a pharmacological dose of MK-4, 45 mg, is used to treat osteoporosis [1].

tooMuch: >-
  No adverse effects from vitamin K in food or supplements have been reported in humans or animals, so the
  Food and Nutrition Board set no upper limit [1]. The risk that matters is interaction, not toxicity: for
  anyone taking warfarin or a similar blood thinner, a sudden change in vitamin K intake — up or down — can
  strengthen or weaken the drug's effect [1].

interactions: >-
  Warfarin (Coumadin), and similar anticoagulants used in some European countries — phenprocoumon,
  acenocoumarol and tioclomarol — work against vitamin K, and the interaction can be serious and dangerous:
  people taking them need to keep their vitamin K intake from food and supplements consistent, because sudden
  changes can increase or decrease the drug's effect [1]. Antibiotics can kill the gut bacteria that make
  vitamin K, especially cephalosporins such as cefoperazone, although supplements are usually needed only when
  antibiotic use is prolonged and intake is poor [1]. Bile acid sequestrants such as cholestyramine (Questran)
  and colestipol (Colestid) can reduce vitamin K absorption [1]. Orlistat (Alli, Xenical) reduces the
  absorption of fat-soluble vitamins, and combined with warfarin can significantly lengthen prothrombin time
  [1]. If you take a blood thinner, talk to your doctor before changing how much vitamin K you eat or taking any
  supplement that contains it; for the other medicines, ask your doctor or pharmacist.

