evidence:
  established: >-
    Bone maintenance. For adults, the official values were set mainly at the amount needed to maintain bone
    and keep calcium balance neutral [2], and the recommended amount for women rises from 1,000 mg to
    1,200 mg after age 50 to lessen bone loss after menopause [1].
  notSupported: >-
    Weight loss: a meta-analysis of 41 trials in 4,802 adults found that calcium supplements had no effect
    on body weight or body fat, and that more calcium from dairy had none either except when combined with
    an energy-restricted diet [5]. Cancer prevention: most trials do not support it — the Women's Health
    Initiative found no effect on cancer incidence during the 7-year trial or over 22.3 years of follow-up,
    and a meta-analysis of 10 trials in 10,496 people who took at least 500 mg of calcium a day found no
    change in total cancer risk [1].
  mixed: >-
    Bone density and fractures in older adults: some trials and meta-analyses find that calcium, usually
    with vitamin D, increases bone density, but whether the increases matter clinically is not clear, and
    results for fractures conflict — see "What about vitamin D?" above [1]. The U.S. Preventive Services Task
    Force found the evidence inadequate to judge calcium for preventing fractures in men and premenopausal
    women [4]. Heart disease: some trials and cohort studies suggest calcium supplements raise
    cardiovascular risk and others find no link; an expert panel of the National Osteoporosis Foundation
    and the American Society for Preventive Cardiology judged that calcium from food or supplements neither
    increases nor decreases it, and that intakes within the upper limit are safe for the heart [6].
    Pre-eclampsia: supplements in pregnancy might reduce the risk, but possibly only for women with low
    calcium intakes, and much of the evidence comes from studies with methodological weaknesses [1].

disagreements: >-
  Several bodies recommend calcium supplements in pregnancy, to reduce the risk of pre-eclampsia, for women
  whose intake is low. The World Health Organization recommends 1,500 to 2,000 mg a day for pregnant women
  with low dietary intakes, and the American College of Obstetricians and Gynecologists says that amount
  might reduce the severity of pre-eclampsia in women who take in less than 600 mg a day [1]. Canadian,
  international, and Australian and New Zealand groups make similar recommendations [1].

tooMuch: >-
  High blood and urine calcium are rare in healthy people and usually result from cancer, overactive
  parathyroid glands or other conditions, not diet [1]. They can cause poor muscle tone, kidney problems,
  constipation, nausea, weight loss, fatigue, frequent urination and heart rhythm problems [1]. Some studies
  suggest that high intakes may raise the risk of cardiovascular disease and of prostate cancer — for
  prostate cancer, possibly only calcium from dairy — but not all studies agree [1]. The evidence behind
  the upper limit itself, a link with kidney stones, is described under "What about vitamin D?" above [1].

interactions: >-
  Calcium supplements can substantially lower blood levels of the HIV drug dolutegravir (Tivicay, Dovato),
  and the drug's labels advise taking it 2 hours before or 6 hours after calcium. Calcium carbonate can
  interfere with the absorption of levothyroxine, a thyroid hormone, and its label advises not taking the
  two within 4 hours of each other. Calcium supplements reduce the absorption of quinolone antibiotics such
  as ciprofloxacin, which taking the antibiotic 2 hours before or after the calcium prevents. Long-term use
  of lithium can raise blood calcium, and calcium supplements could add to that risk [1]. If you take any of
  these regularly, talk to your doctor or pharmacist before taking a calcium supplement.

