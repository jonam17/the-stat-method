ul:
  rows:
    - { group: "19–50", male: 2500, female: 2500, pregnancy: 2500, lactation: 2500 }
    - { group: "51–70", male: 2000, female: 2000 }
    - { group: ">70", male: 2000, female: 2000 }
  appliesTo: total
  note: The upper limit is the most a day that is unlikely to cause harm, not a target. For adults it falls from 2,500 mg to 2,000 mg at age 51.

does: >-
  Calcium is the most abundant mineral in the body. Almost all of it — 98% — is stored in the bones,
  which act as a reservoir the body draws on to keep blood levels steady [1]. It makes up much of the
  structure of bones and teeth, and the small amount in the blood and tissues is needed for blood
  vessels to contract and relax, for muscles and nerves to work, for blood to clot and for hormones to
  be released [1]. Vitamin D is required for the gut to absorb calcium by active transport and to keep
  blood levels adequate [1].

forms: >-
  Supplements usually contain calcium carbonate or calcium citrate [1]. Calcium carbonate is 40% calcium
  by weight and calcium citrate 21%, but the label lists the amount of calcium itself, so there is
  nothing to calculate [1]. Calcium citrate depends less on stomach acid and can be taken without food;
  calcium carbonate is absorbed less well by people with low stomach acid unless it is taken with a meal,
  and it causes more gas, bloating and constipation, especially in older adults [1]. Calcium carbonate is
  also the calcium in some antacids, such as Tums and Rolaids [1].

absorption: >-
  The more calcium taken in at once, the smaller the share absorbed: about 45% of an intake of 200 mg a day
  from food, but only 15% above 2,000 mg a day [1]. From supplements, absorption is highest at 500 mg or
  less at a time — the body absorbs about 36% of a 300 mg dose and 28% of a 1,000 mg dose — and is greater
  when they are taken with food [1]. Absorption also falls with age, to about 25% in adulthood and lower
  after that [1]. Some plants contain compounds that bind calcium: only 5% of the calcium in spinach is
  absorbed, against 27% from milk, while broccoli, kale and cabbage are absorbed about as well as milk,
  though they contain less [1]. Caffeine and phosphorus reduce absorption slightly, and low vitamin D
  status reduces it more [1].

pairing:
  heading: What about vitamin D?
  text: >-
    Calcium is often sold together with vitamin D [1]. The reason is real — vitamin D is needed for the gut
    to absorb calcium by active transport — and the Food and Drug Administration allows supplements that
    contain both to claim they reduce the risk of osteoporosis [1]. Whether the combination prevents
    fractures is less clear. A meta-analysis of eight trials in 30,970 adults over 50, who took 500 to
    1,200 mg of calcium and 10 to 20 mcg (400 to 800 IU) of vitamin D a day, found 15% fewer fractures
    overall and 30% fewer hip fractures; two other reviews, one of 11 trials in 51,419 adults, found no
    effect on hip or total fractures [1]. The U.S. Preventive Services Task Force concluded with moderate
    certainty that daily amounts below 1,000 mg of calcium and 10 mcg (400 IU) of vitamin D do not prevent
    fractures in postmenopausal women, and that the evidence on larger amounts is inadequate [4]. The
    combination also brings a question of risk. In the Women's Health Initiative, 36,282 women aged 50 to
    79 took 1,000 mg of calcium and 10 mcg of vitamin D a day or a placebo. Its link between supplemental
    calcium and kidney stones is the basis for the upper limit, although two later systematic reviews found
    no such link [1]. Over a median 22.3 years of follow-up, women given the supplements had 7% lower cancer
    mortality but a 6% higher risk of death from cardiovascular disease [3].

deficiency: >-
  Calcium deficiency reduces bone strength and can lead to osteoporosis, with fragile bones and a higher
  risk of falling [1]. Chronic deficiency can also cause osteomalacia — poorly mineralised, softened bone —
  although that is more often caused by lack of vitamin D [1]. Low blood calcium (hypocalcemia) usually
  results not from diet but from vitamin D or magnesium deficiency, parathyroid problems, critical illness
  or certain medicines; when it causes symptoms, the most common are numbness around the mouth, tingling in
  the hands and feet, and muscle spasms [1]. A blood test does not show calcium status, because blood
  levels are tightly controlled; a bone density scan reflects status over a lifetime [1].

atRisk:
  - Postmenopausal women — falling estrogen reduces calcium absorption and increases losses from urine and bone, and women lose about 1% of their bone density a year after menopause; the recommended amount rises to 1,200 mg after 50 to lessen that loss [1]
  - People who avoid dairy, including those with lactose intolerance or a milk allergy, and vegans; lactose-free dairy has the same calcium, but those who avoid dairy entirely typically need fortified foods or supplements to reach recommended amounts [1]

usIntake: >-
  Many Americans get less calcium than recommended: in national survey data from 2007–2010, 39% of everyone
  aged 4 and older took in less than the estimated average requirement from food and supplements [1]. Men
  aged 20 and older average 1,083 mg a day from food and drink and women 842 mg; about 22% of men and 32%
  of women take a supplement containing calcium, bringing average totals to 1,156 mg and 1,009 mg [1].
  About 72% of the calcium Americans eat comes from dairy products and foods with dairy ingredients [1].
  Inadequate intake is more common among non-Hispanic Black and non-Hispanic Asian Americans (47% to 48%)
  than among Hispanic (30%) and non-Hispanic White Americans (24%), and among adults 50 and older in
  low-income households [1].

