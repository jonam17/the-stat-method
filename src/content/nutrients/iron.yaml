# The text says: "The FNB has established ULs for iron from food and supplements".
ul:
  rows:
    - { group: "19–50", male: 45, female: 45, pregnancy: 45, lactation: 45 }
    - { group: "51–70", male: 45, female: 45 }
    - { group: ">70", male: 45, female: 45 }
  appliesTo: total
  note: The upper limit covers iron from food and supplements combined, and was set at the amounts linked with stomach and gut side effects from iron supplements. It is the most that is unlikely to cause harm, not a target. Doctors sometimes prescribe more — to replenish iron stores in iron-deficiency anemia, for example.

does: >-
  Iron is an essential part of hemoglobin, the protein in red blood cells that carries oxygen from the lungs
  to the tissues [1]. As part of myoglobin, another oxygen-carrying protein, it supports muscle metabolism and
  healthy connective tissue, and it is needed for physical growth, neurological development, cellular
  functioning and making some hormones [1]. Most of the 3 to 4 grams in an adult is in hemoglobin; much of the
  rest is stored in the liver, spleen and bone marrow [1]. The body loses only small amounts, except through
  bleeding — which is why losses are greater in women who menstruate [1].

forms: >-
  Food contains two forms of iron. Meat, seafood and poultry contain both heme and nonheme iron; plants and
  iron-fortified foods contain only nonheme iron [1]. Heme iron is better absorbed and less affected by other
  foods, though it supplies only about 10% to 15% of the iron in Western diets [1]. Supplements mostly use iron
  salts such as ferrous sulfate, ferrous gluconate, ferric citrate and ferric sulfate; the ferrous forms
  dissolve better and are more bioavailable than the ferric [1]. Forms differ in how much iron they carry —
  ferrous fumarate is 33% iron by weight, ferrous sulfate 20% and ferrous gluconate 12% — but the label lists
  the iron itself [1]. Other forms, such as heme iron polypeptides, carbonyl iron and iron amino-acid chelates,
  might cause fewer stomach side effects than iron salts [1].

absorption: >-
  About 14% to 18% of the iron in mixed diets that include substantial amounts of meat, seafood and vitamin C
  is absorbed, against 5% to 12% from vegetarian diets [1]. Vitamin C, meat, poultry and seafood all increase
  the absorption of nonheme iron, while phytate in grains and beans and some polyphenols reduce it; calcium
  might reduce the absorption of both forms [1]. In a typical Western diet these effects are weakened and make
  little difference to most people's iron status [1]. In some plant foods that contain iron, such as spinach,
  it is poorly absorbed because they also contain polyphenols [1]. Because calcium might interfere, experts suggest
  taking separate calcium and iron supplements at different times of day [1].

deficiency: >-
  Iron deficiency develops in stages: first the body's stores run down, then the supply to new red blood cells
  falls while hemoglobin is still normal, and finally iron-deficiency anemia sets in, with low hemoglobin and
  small, pale red blood cells [1]. Anemia brings gastrointestinal problems, weakness, fatigue and difficulty
  concentrating, and can impair thinking, immune function, exercise and work capacity, and temperature control
  [1]. Serum ferritin, a measure of iron stores, is the most efficient and cost-effective test: below 30 mcg/L
  suggests iron deficiency and below 10 mcg/L suggests anemia, though inflammation can raise ferritin [1].
  Because iron deficiency goes with poor diet, malabsorption and blood loss, people who have it often lack other
  nutrients too [1].

atRisk:
  - Pregnant women — needs rise as blood volume expands, and deficiency raises the risk of maternal and infant death, premature birth and low birthweight [1]
  - Women with heavy menstrual bleeding, which affects at least 10% of women who menstruate and might account for a third or more of iron-deficiency anemia in women of reproductive age [1]
  - Frequent blood donors — 25% to 35% of regular donors develop iron deficiency [1]
  - People with cancer — up to 60% of people with colon cancer have iron deficiency when diagnosed [1]
  - People with celiac disease, ulcerative colitis or Crohn's disease, or who have had stomach or intestinal surgery [1]
  - People with chronic heart failure, about 60% of whom have iron deficiency [1]

usIntake: >-
  Most people in the United States get enough iron from their diets, but teenage girls, pregnant women and
  premenopausal women are among those at risk of getting too little [1]. Adult men average 16.3 to 18.2 mg a
  day from food and adult women 12.6 to 13.5 mg; with supplements, totals are 19.3 to 20.5 mg for men and 17.0
  to 18.9 mg for women [1]. About half of dietary iron comes from bread, cereal and other grain products, and
  wheat flour in the United States is fortified with iron [1]. About 14% to 18% of Americans take a supplement
  containing iron, rising to 72% of pregnant women [1]. Among pregnant women, iron deficiency is more common in
  Mexican American (23.6%) and non-Hispanic Black women (29.6%) than in non-Hispanic White women (13.9%) [1].

