evidence:
  established: >-
    Iron is essential for making hemoglobin, and enough of it prevents iron-deficiency anemia [1]. In
    pregnancy, a Cochrane review found that daily supplements of 9 to 90 mg reduced anemia at term by 70% and
    iron deficiency at term by 57%, and that low birthweight was less common (8.4% against 10.2%) [2]. In a
    trial of 215 adults who had given blood in the previous 3 to 8 days, those given 37.5 mg of iron a day for
    24 weeks recovered their lost hemoglobin and iron in less than half the time of those given none [5].
  notSupported: >-
    For pregnant women without symptoms, trials have not settled whether routine supplements do more good than
    harm: the U.S. Preventive Services Task Force concluded that the evidence is insufficient to weigh the
    benefits and harms of routine screening or supplementation [3]. In anemia caused by chronic disease, only a
    few small studies have tested oral iron, and its use there is controversial because iron might increase the
    risk of infection and cardiovascular events [1].
  mixed: >-
    Heart failure: two prospective studies linked iron deficiency in people with heart failure with a higher
    risk of heart transplant and death, independent of anemia, but an analysis of U.S. survey data on adults
    with self-reported heart failure found no link with mortality [1].

disagreements: >-
  U.S. bodies disagree about iron in pregnancy. The American College of Obstetricians and Gynecologists
  recommends low-dose iron supplements from the first trimester, and screening all pregnant women for anemia
  [4]. The U.S. Preventive Services Task Force finds the evidence insufficient to assess routine screening or
  supplementation for pregnant women without symptoms [3]. The Food and Nutrition Board notes that pregnant
  women's median intake is well below the average requirement and that they need supplements, and the Dietary
  Guidelines for Americans advises taking one when an obstetrician or other health care provider recommends it
  [1].

tooMuch: >-
  Adults with normal digestion have very little risk of iron overload from food [1]. Supplements are different:
  25 mg or more can reduce zinc absorption, and high doses can cause stomach upset, constipation, nausea,
  abdominal pain, vomiting and diarrhea — taking them with food can lessen this [1]. Large overdoses can kill.
  Accidental swallowing of iron supplements caused about a third of the child poisoning deaths reported in the
  United States between 1983 and 1991, and iron supplements sold as tablets or capsules must carry an FDA
  warning that accidental overdose is a leading cause of fatal poisoning in children under 6 — keep them out of
  children's reach [1]. People with hereditary hemochromatosis absorb too much iron and, without treatment,
  typically develop signs of iron toxicity, such as liver and heart disease, by their 30s [1]. About 1 in 10
  White people carry the most common gene variant, though far fewer have the disease [1], and liver specialists
  recommend that people with it avoid iron and vitamin C supplements [6].

interactions: >-
  Iron supplements can reduce the absorption of levodopa, used for Parkinson's disease and restless legs
  syndrome, and its labels warn that this may make it less effective. Taking iron and levothyroxine, a thyroid
  hormone, together can make the levothyroxine less effective; some labels advise not taking it within 4 hours
  of an iron supplement. Proton pump inhibitors such as lansoprazole and omeprazole reduce stomach acid and can
  reduce iron absorption; long-term use is not associated with iron depletion in people with normal iron stores,
  but people with iron deficiency who take them can respond poorly to iron supplements [1]. If you take any of
  these regularly, talk to your doctor or pharmacist before taking an iron supplement.

