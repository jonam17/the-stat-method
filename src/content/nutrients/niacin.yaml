  type: RDA
  unitLabel: mg NE
  rows:
    - { group: "19–50", male: 16, female: 14, pregnancy: 18, lactation: 17 }
    - { group: "51–70", male: 16, female: 14 }
    - { group: ">70", male: 16, female: 14 }
  note: Amounts are in niacin equivalents (NE), which count the niacin the body makes from tryptophan, an amino acid in protein — 1 mg NE is 1 mg of niacin or 60 mg of tryptophan. The food amounts further down are niacin alone; they leave out tryptophan, some of which the body turns into niacin.
  eighteenNote: People aged 18 fall in the official 14–18 group, which has the same values — 16 mg NE a day for males and 14 mg NE for females, 18 mg NE in pregnancy and 17 mg NE when breastfeeding. Its upper limit for supplemental niacin is lower, at 30 mg.

