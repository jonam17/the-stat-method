    - { group: "51–70", male: 35, female: 35 }
    - { group: ">70", male: 35, female: 35 }
  appliesTo: supplemental
  scope: This limit applies only to supplemental niacin — both nicotinic acid and nicotinamide — not to niacin found naturally in food.
  note: The limit is the most supplemental niacin a day that is unlikely to cause harm, not a target. It is based on the skin flushing nicotinic acid causes, and also covers nicotinamide, which does not cause flushing, to guard against its other effects. No adverse effects have been reported from niacin found naturally in food. The limit does not apply to people taking niacin under medical supervision.

does: >-
  Niacin, also called vitamin B3, is the name for nicotinic acid, nicotinamide and related compounds [1].
  Every tissue converts it into NAD, a coenzyme that more than 400 enzymes require — more than for any other
  coenzyme made from a vitamin [1]. NAD helps transfer the energy in carbohydrates, fats and proteins to
  ATP, the cell's energy currency, and is needed to maintain DNA and control gene expression [1]. Its partner
  NADP is used to make cholesterol and fatty acids and helps maintain the cell's antioxidant defences [1].

forms: >-
  Most niacin in food is nicotinic acid or nicotinamide [1]. Animal foods such as poultry, beef and fish
  provide about 5 to 10 mg per serving, mainly in highly available forms, while nuts, legumes and grains
  provide about 2 to 5 mg, mainly as nicotinic acid [1]. The body also makes NAD from tryptophan: about 60 mg
  of tryptophan yields 1 mg of niacin, though the rate varies considerably between people [1]. Supplements
  mostly contain nicotinic acid or nicotinamide, and some niacin-only products contain 500 mg or more per
  serving [1]. Supplements of inositol hexanicotinate, often labelled flush-free, deliver on average 30% less
  niacin than nicotinic acid or nicotinamide [1]. Extended-release nicotinic acid, 500 to 1,000 mg, is a
  prescription medicine for high cholesterol [1].

absorption: >-
  Niacin is almost completely absorbed, even in very high doses of 3 to 4 g [1]. In some grain products,
  the niacin naturally present is bound in a form that makes only about 30% of it available, while niacin
  added to enriched and fortified foods is free and highly available [1]. People who get too little
  riboflavin, vitamin B6 or iron make less niacin from tryptophan [1].

deficiency: >-
  Severe deficiency causes pellagra: a pigmented rash or brown discoloration on skin exposed to sunlight, a
  bright red tongue, vomiting, constipation or diarrhea, and neurological symptoms — depression, apathy,
  headache, fatigue and memory loss that can progress to aggressive, paranoid and suicidal behaviour and
  hallucinations [1]. As it progresses, appetite is lost and, eventually, the person dies [1]. Pellagra is
  very rare in the United States and mostly limited to people living in poverty on very limited diets low in
  niacin and protein, although some people have marginal or low niacin status [1]. Blood levels are not a
  reliable measure; the most reliable is the amount of two niacin metabolites excreted in urine [1].

atRisk:
  - People who are undernourished because of poverty, anorexia, alcohol use disorder, AIDS, inflammatory bowel disease or liver cirrhosis [1]
  - People who get too little riboflavin, vitamin B6 or iron, which the body needs to make niacin from tryptophan [1]
  - People with Hartnup disease, a rare genetic disorder that limits the absorption of tryptophan [1]
  - People with carcinoid syndrome, in whom tryptophan is used to make serotonin instead of niacin [1]

usIntake: >-
  Most Americans get more than the recommended amount: in national survey data from 2015–2016, average
  intake from food and drink was 31.4 mg a day for men and 21.3 mg for women [1]. In 2009–2012 data, only 1% of
  adults took in less than the average requirement from food and drink [1]. About 21% of people aged 2 and
  older take a supplement containing niacin, rising to 39% of men and 40% of women aged 60 and older, and
  supplements doubled or tripled total intakes [1]. In 2003–2006 data, 10% of supplement users had total
  intakes at or above the upper limit [1].

