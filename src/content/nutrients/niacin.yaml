evidence:
  established: >-
    NAD and NADP, made from niacin, are needed for most of the oxidation and reduction reactions in cells,
    and too little niacin causes pellagra [1]. Pellagra caused by the tuberculosis drug isoniazid can be
    prevented with more niacin, and the World Health Organization treats pellagra with nicotinamide [1].
  notSupported: >-
    Heart disease. Very high doses of nicotinic acid — more than 100 times the recommended amount — improve
    blood lipids, but the fact sheet concludes that they have no significant effect on the risk of
    cardiovascular events [1]. In the largest trial, 25,673 adults aged 50–80 (83% men) with cardiovascular
    disease, already taking a statin, took 2 g of extended-release nicotinic acid a day or a placebo for a
    median of 4 years: major vascular events did not fall, and diabetes, digestive problems, bleeding and skin
    problems increased [1]. A review of 23 trials in 39,195 people found no reduction in deaths, heart attacks
    or strokes [1]. The American College of Cardiology and the American Heart Association do not recommend
    niacin as an add-on to statins [1].
  mixed: >-
    In a 1970s trial, 8,341 people aged 30 to 64 who had had a heart attack took one of five
    cholesterol-lowering drugs — one of them 3,000 mg of nicotinic acid a day — or a placebo for an average of
    6.2 years; those on nicotinic acid had fewer
    nonfatal heart attacks but more irregular heart rhythms, and no fewer deaths during the trial [1]. Nine
    years after it ended, they had 11% fewer deaths from any cause than the placebo group [1]. A 2018 review of
    three trials in 29,195 patients found that adding 1 to 3 g of extended-release nicotinic acid to a statin
    increased deaths from any cause by 10% [1].

tooMuch: >-
  Niacin naturally present in food has not been reported to cause harm [1]. From supplements, 30 to 50 mg or
  more of nicotinic acid typically causes flushing — reddening of the face, arms and chest with burning,
  tingling and itching — which is usually transient but can come with headache, rash, dizziness or a fall in
  blood pressure [1]. Doses of 1,000 to 3,000 mg a day can cause low blood pressure severe enough to risk
  falls, fatigue, impaired glucose tolerance and insulin resistance, nausea, heartburn and abdominal pain, and
  blurred vision or fluid at the centre of the retina [1]. Taken for months or years, high doses can damage the
  liver, up to acute liver failure, more often with extended-release forms [1]. Nicotinamide does not cause
  flushing, but 3,000 mg a day can cause nausea, vomiting and signs of liver toxicity [1]. Doses in the
  thousands of milligrams to treat high cholesterol are drug use, and the fact sheet says they should be taken
  only with medical approval and supervision [1].

interactions: >-
  Isoniazid and pyrazinamide, used to treat tuberculosis, interfere with the body's production of niacin from
  tryptophan; pellagra can occur during isoniazid treatment and can be prevented with more niacin [1]. Large
  doses of nicotinic acid can raise blood sugar — most likely at 1.5 g a day or more — so people taking
  medicines for diabetes who also take high-dose nicotinic acid should have their blood sugar monitored [1].
  If you take any of these regularly, talk to your doctor or pharmacist before taking a niacin supplement.

