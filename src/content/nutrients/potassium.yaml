# Potassium — every value from the NIH Office of Dietary Supplements Health
# Professional fact sheet (reference 1), updated 2 Jun 2022. Read from the
# full-page PDF supplied by the maintainer on 2026-10-18. Numbered markers [n]
# refer to `references` below. Follow docs/LIBRARY-WORKFLOW.md.
# Checked against the fact sheet by the maintainer on 2026-10-18.
# DRAFT until a person has checked every value against the source.
#
# Table 1 gives Adequate Intakes (updated by the National Academies in 2019) with
# a "51+ years" row, repeated in 51–70 and >70. Its footnote: "The AIs do not
# apply to individuals with impaired potassium excretion because of medical
# conditions (e.g., kidney disease) or the use of medications that impair
# potassium excretion." There is no upper limit; the sheet says even intakes
# below the AI can cause hyperkalemia in those people, so `ul.warning` carries it.
draft: false
name: Potassium
kind: mineral
dek: A mineral every cell needs for nerve signals, muscle contraction and kidney function, closely linked with sodium. Most Americans get less than recommended.
unit: mg

intake:
  type: AI
  rows:
    - { group: "19–50", male: 3400, female: 2600, pregnancy: 2900, lactation: 2800 }
    - { group: "51–70", male: 3400, female: 2600 }
    - { group: ">70", male: 3400, female: 2600 }
  note: These are Adequate Intakes, based on the highest median intakes in healthy people. They do not apply to people whose kidneys excrete potassium poorly, because of kidney disease or medicines. Food labels calculate % Daily Value from 4,700 mg, more than these amounts.
  eighteenNote: People aged 18 fall in the official 14–18 group — 3,000 mg a day for males and 2,300 mg for females, 2,600 mg in pregnancy and 2,500 mg when breastfeeding. There is no upper limit at any age.

ul:
  warning: No upper limit does not mean safe for everyone. If you have kidney disease, or take an ACE inhibitor or a potassium-sparing diuretic, even ordinary amounts — below the recommended intake — can raise blood potassium to dangerous levels, and angiotensin receptor blockers can raise it too. Talk to your doctor before taking a potassium supplement or using a salt substitute.
  note: No upper limit has been set for potassium, because in healthy people with normal kidney function the kidneys remove the excess, and there is no evidence that high intakes cause harm. Case reports describe heart problems and death from very large doses of supplements, but the National Academies judged them insufficient to set a limit.

does: >-
  Potassium is present in every tissue and is needed for normal cell function, because it maintains the fluid
  volume inside cells and the electrical gradient across their membranes [1]. That gradient is required for nerve
  transmission, muscle contraction and kidney function [1]. Potassium is closely linked with sodium, the main
  regulator of fluid outside cells [1].

forms: >-
  Fruits and vegetables contain potassium as phosphate, sulfate, citrate and other forms, but not as potassium
  chloride, the form used in salt substitutes and many supplements [1]. Most supplements contain no more than 99
  mg — about 2% of the Daily Value — because the FDA has linked some potassium chloride drugs above that amount to
  small-bowel lesions [1]. Salt substitutes vary widely, from about 440 to 2,800 mg per teaspoon [1].

absorption: >-
  The body absorbs about 85% to 90% of the potassium in food [1]. Whole-wheat flour and brown rice contain much
  more than white flour and white rice [1]. Milk, coffee, tea, other nonalcoholic drinks and potatoes are the top
  sources for U.S. adults [1].

deficiency: >-
  Too little potassium can raise blood pressure, kidney stone risk, bone turnover, calcium loss in urine and salt
  sensitivity [1]. Severe deficiency causes hypokalemia — rare in healthy people with normal kidney function, but
  found in up to 21% of hospital patients, usually because of diuretics and other medicines [1]. Mild hypokalemia
  causes constipation, fatigue, muscle weakness and malaise; severe hypokalemia can cause paralysis, poor breathing
  and dangerous heart rhythms [1]. It rarely comes from diet alone, more often from diarrhea, vomiting, laxative
  misuse, diuretics or heavy sweating, and magnesium depletion can contribute [1].

atRisk:
  - People with inflammatory bowel disease, such as Crohn's disease or ulcerative colitis [1]
  - People taking certain diuretics, such as thiazides, or using large doses of laxatives or repeated enemas [1]
  - People with pica who eat clay, which binds potassium in the gut [1]

usIntake: >-
  Americans consistently eat less potassium than recommended, and the Dietary Guidelines name it a nutrient of
  public health concern [1]. In 2013–2014, average intake from food was 3,016 mg a day for men and 2,320 mg for women
  [1]. About 12% of people take a supplement containing potassium, but it adds an average of only 87 mg a day [1].

