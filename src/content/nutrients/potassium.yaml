evidence:
  established: >-
    Potassium is essential for nerve transmission, muscle contraction and kidney function [1]. The FDA allows the
    health claim that diets containing foods that are good sources of potassium and low in sodium may reduce the
    risk of high blood pressure and stroke [1].
  notSupported: >-
    In 2019, the National Academies found the evidence insufficient to set an intake of potassium for reducing the
    risk of chronic disease [1]. A Cochrane review of the six highest-quality trials found no significant reduction
    in blood pressure from potassium supplements [1].
  mixed: >-
    Blood pressure: other meta-analyses find that supplements, mostly potassium chloride, lower blood pressure —
    most in people with high blood pressure, with no significant effect in those without it [1]. Some of the benefit
    of potassium salt substitutes may come from the sodium they replace [1]. Stroke: in a meta-analysis of 11 cohort
    studies in 247,510 adults, 1,640 mg a day more potassium was linked to a 21% lower risk of stroke, but a
    government review found the observational evidence inconsistent [1]. Kidney stones: potassium citrate reduced
    new stones in trials, though the effect is attributed to the citrate [1].

tooMuch: >-
  In healthy people with normal kidney function, high intakes from food are not a risk [1]. But in people whose
  kidneys excrete potassium poorly — because of chronic kidney disease or medicines such as ACE inhibitors or
  potassium-sparing diuretics — even intakes below the Adequate Intake can cause hyperkalemia, as can type 1
  diabetes, heart failure, adrenal insufficiency or liver disease [1]. Severe hyperkalemia can cause muscle
  weakness, paralysis, palpitations and life-threatening heart rhythms [1]. Very large amounts from supplements or
  salt substitutes can cause it even in healthy people [1].

interactions: >-
  ACE inhibitors such as benazepril and angiotensin receptor blockers such as losartan reduce potassium loss in urine
  and can cause hyperkalemia, as can potassium-sparing diuretics such as amiloride and spironolactone [1]. Loop
  diuretics such as furosemide and thiazides increase potassium loss and can cause hypokalemia [1]. Experts recommend
  monitoring potassium in people taking any of these [1]. If you take one regularly, talk to your doctor or pharmacist
  before taking a potassium supplement or using a salt substitute.

