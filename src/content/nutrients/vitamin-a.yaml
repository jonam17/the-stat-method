evidence:
  established: >-
    Vision, immune function, growth and reproduction depend on vitamin A, and night blindness is the first
    sign of deficiency [1]. Deficiency is one of the top causes of preventable blindness in children [1].
  notSupported: >-
    Cancer prevention. Among nonsmokers, beta-carotene and vitamin A supplements do not appear to affect
    the risk of cancer [1]. In smokers they have done harm. In CARET, 18,314 current and former smokers and
    asbestos-exposed workers aged 45–74 took 30 mg beta-carotene plus 7,500 mcg RAE (25,000 IU) retinyl
    palmitate a day or a placebo; the trial was stopped early, after a mean of 4 years, when lung cancer
    was 28% higher, lung cancer deaths 46% higher and deaths from all causes 17% higher [1]. In ATBC, 29,133
    male smokers aged 50–69 who took 20 mg beta-carotene a day for 5 to 8 years had 18% more lung cancer
    and an 8% higher death rate [1]. In AREDS2, in which no current smokers were given beta-carotene, more
    lung cancers occurred in the beta-carotene group (23 against 11), 31 of the 34 in former smokers [1].
    Three other trials, with smaller shares of smokers, found no effect on lung cancer [1].
  mixed: >-
    Age-related macular degeneration: in AREDS, people at high risk of advanced AMD who took a daily
    supplement of beta-carotene (15 mg), vitamins C and E, zinc and copper for 5 years had a 25% lower risk
    of advanced AMD than those on placebo [1]. AREDS2 found the formula protected as well without
    beta-carotene, and replacing it with lutein and zeaxanthin lowered the risk of progression further [1].
    The fact sheet advises people who have or are developing AMD to talk to their health care provider about
    the AREDS formulations [1]. Other cancers: observational studies link higher intakes of retinol,
    carotenoids, or fruit and vegetables with lower risk of several cancers, while others find no link [1].
    Measles: in a 2022 Cochrane review, six trials in 19,566 children aged 6 months to 5 years in low- and
    middle-income countries found that high-dose vitamin A halved new cases of measles, but six trials in
    more than a million children found no effect on deaths from measles [1].

tooMuch: >-
  Because vitamin A is fat-soluble, the body stores the excess, mainly in the liver [1]. One or a few very
  high doses — typically more than 100 times the recommended amount — cause acute toxicity within days to
  weeks: severe headache, blurred vision, nausea, dizziness, aching muscles and poor coordination, and in
  severe cases raised fluid pressure around the brain, drowsiness, coma and death [1]. Regular high doses
  cause dry skin, painful muscles and joints, fatigue, depression and abnormal liver test results [1]. Total
  intakes of preformed vitamin A above the upper limit can cause birth defects of the eye, skull, lungs and
  heart, and experts advise women who are or might be pregnant, and those who are breastfeeding, not to take
  supplements providing more than 3,000 mcg RAE (10,000 IU) a day [1]. Beta-carotene is not known to cause
  birth defects; too much over a long time turns the skin yellow-orange, a harmless condition that reverses
  when intake stops [1]. Even so, the Food and Nutrition Board advises against beta-carotene supplements for
  the general population, except as a source of vitamin A to prevent deficiency [1].

interactions: >-
  Orlistat (Alli, Xenical), a weight-loss drug, reduces the absorption of vitamin A, beta-carotene and the
  other fat-soluble vitamins, and its makers recommend a multivitamin that contains them [1]. Synthetic
  retinoids taken by mouth — such as acitretin (Soriatane) for psoriasis and bexarotene (Targretin) for the
  skin effects of T-cell lymphoma — can raise the risk of vitamin A toxicity when combined with vitamin A
  supplements [1]. If you take any of these regularly, talk to your doctor or pharmacist before taking a
  vitamin A supplement.

