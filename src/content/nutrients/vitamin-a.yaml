  appliesTo: preformed
  scope: This limit applies only to preformed vitamin A — retinol and its esters, such as retinyl palmitate — from animal foods and supplements. It does not apply to beta-carotene or other carotenoids. For a supplement that contains both, count only the share from retinol or its esters.
  note: The limit is the most preformed vitamin A a day, from food and supplements combined, that is unlikely to cause harm — not a target. It is in mcg of preformed vitamin A, where 1 mcg equals 1 mcg RAE. It was set from the amounts linked to liver abnormalities, birth defects and toxic effects in infants and children. No limit has been set for beta-carotene or the other carotenoids the body converts to vitamin A. One 3-ounce serving of pan-fried beef liver, the first food listed below, provides 6,582 mcg RAE, mainly as preformed vitamin A — more than twice the limit.

does: >-
  Vitamin A is a group of fat-soluble compounds, mainly retinol and retinyl esters [1]. It is involved in
  immune function, communication between cells, growth and development, and reproduction, and supports the
  normal formation and maintenance of the heart, lungs, eyes and other organs [1]. It is essential for
  vision: it is part of rhodopsin, the light-sensitive protein in the retina, and keeps the cornea and the
  membranes covering the eye working normally [1]. Most of the body's vitamin A is stored in the liver [1].

forms: >-
  The diet provides vitamin A in two forms [1]. Preformed vitamin A — retinol and retinyl esters — is
  found in animal foods, including dairy products, eggs, fish and organ meats [1]. Provitamin A carotenoids
  — beta-carotene, alpha-carotene and beta-cryptoxanthin — are plant pigments that the body converts into
  vitamin A in the intestine, although how efficiently varies between people, partly for genetic reasons
  [1]. Other carotenoids, such as lycopene, lutein and zeaxanthin, are not converted [1]. In the United
  States, about 65% to 80% of the vitamin A people consume is preformed [1]. Supplements contain retinyl
  acetate, retinyl palmitate, beta-carotene or a mix; 3,000 mcg RAE is a common amount, and multivitamins
  often contain 750 to 1,050 mcg RAE [1].

absorption: >-
  The body may absorb 75% to 100% of the retinol in food but, in most cases, only 10% to 30% of the
  beta-carotene [1]. Cooking and heat treatment can make the beta-carotene in food more available [1]. From
  supplements, 70% to 90% of preformed vitamin A is absorbed, and 8.7% to 65% of beta-carotene [1]. Vitamin A
  is routinely added to some foods, including milk and margarine, and some ready-to-eat cereals are
  fortified with it [1].

deficiency: >-
  Frank deficiency is rare in the United States but still common in many low-income countries [1]. Its
  most common sign is xerophthalmia, and the first symptom is night blindness — difficulty seeing in low
  light or darkness — caused by low levels of rhodopsin in the retina [1]. Xerophthalmia also damages the
  cornea and can end in permanent blindness; vitamin A deficiency is one of the top causes of preventable
  blindness in children [1]. Chronic deficiency is also linked to respiratory diseases such as pneumonia,
  anemia, and more severe and deadly infections, particularly measles and diarrhea [1]. Blood retinol does
  not fall until the liver's stores are almost depleted, but a level of 20 mcg/dL or less often reflects
  moderate deficiency, and 10 mcg/dL or less severe deficiency [1].

atRisk:
  - Pregnant and breastfeeding women in low- and middle-income countries — pregnancy raises the need for vitamin A, and about 10% to 20% of pregnant women in low-income countries are deficient [1]
  - People with cystic fibrosis — up to 90% have pancreatic insufficiency, which makes fat, and with it vitamin A, hard to absorb [1]
  - People with Crohn's disease or ulcerative colitis, especially those who have had the disorder for several years [1]
  - Some people with newly diagnosed celiac disease; a gluten-free diet can, but does not always, correct the deficiency [1]

usIntake: >-
  In national survey data from 2017–2018, average intake from food and drink was 682 mcg RAE a day for men
  aged 20 and older and 616 mcg RAE for women [1]. Even so, fewer than 1% of Americans have a blood retinol
  level below 20 mcg/dL, so deficiency is uncommon [1]. In data from 1988–1994, about 26% of the vitamin A
  men consumed and 34% of what women consumed came from carotenoids, and the rest from preformed vitamin A,
  mostly retinyl esters [1]. About 12% to 40% of people, depending on age, take a supplement containing
  vitamin A; adults 71 and older are among the most likely to [1].

