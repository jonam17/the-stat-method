  note: Amounts are in retinol activity equivalents (RAE), which count each form by how much vitamin A the body gets from it — 1 mcg RAE is 1 mcg of retinol, 2 mcg of beta-carotene from supplements, 12 mcg of beta-carotene from food, or 24 mcg of alpha-carotene or beta-cryptoxanthin from food. Older labels used International Units (IU), which convert differently for each form, so a mixed diet's IU cannot be read off a single figure.
  eighteenNote: People aged 18 fall in the official 14–18 group — 900 mcg RAE a day for males and 700 mcg RAE for females, 750 mcg RAE in pregnancy and 1,200 mcg RAE when breastfeeding. The upper limit for preformed vitamin A in that group is 2,800 mcg.

