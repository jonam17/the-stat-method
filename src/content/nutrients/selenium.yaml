evidence:
  established: >-
    Selenium is essential for selenoproteins and thyroid hormone metabolism [1]. Selenium supplements greatly
    reduced Keshan disease where deficiency is endemic — by 86% in a 2018 meta-analysis [1].
  notSupported: >-
    Cancer prevention: in SELECT, 35,533 men aged 50 and older who took 200 mcg a day did not have less prostate
    cancer, and a 2018 Cochrane review of 10 trials concluded that 200 mcg a day does not reduce the overall risk of
    cancer or of any individual type [1]. Heart disease: a Cochrane review of 12 trials in 19,715 mostly male adults
    found that supplements did not reduce cardiovascular events [1]. Cognitive decline: in 7,540 healthy men aged 60
    and older, 200 mcg a day for 5.4 years did not reduce dementia [1].
  mixed: >-
    Thyroid: in chronic autoimmune thyroiditis, supplements lowered thyroid antibodies in some trials, but a
    systematic review found no effect on thyroid function or quality of life, and the American Thyroid Association
    recommends against selenium supplements for pregnant women with thyroid antibodies [1]. In SELECT, men with
    higher selenium status at the start had more high-grade prostate cancer when supplemented, and the researchers
    recommended that men over 55 not take more than the recommended amount from supplements [1]. Male fertility:
    trials conflict [1].

disagreements: >-
  In 2023, the European Food Safety Authority set an upper limit for selenium of 255 mcg a day for all adults,
  including women who are pregnant or breastfeeding, based on systematic reviews of hair loss [1]. The U.S. limit is
  400 mcg [1].

tooMuch: >-
  Chronically high intakes cause selenosis: early signs are a garlic smell on the breath and a metallic taste, and
  the most common are hair loss and brittle or lost nails, with skin rash, nausea, diarrhea, fatigue, irritability
  and nervous system problems [1]. Brazil nuts contain 68 to 91 mcg per nut [1]. Acute toxicity has come from
  wrongly formulated products — in 2008, 201 people had severe reactions to a liquid supplement with 200 times the
  labelled amount — and can cause respiratory distress, heart attack, kidney and heart failure and, rarely, death
  [1].

interactions: >-
  Cisplatin, a chemotherapy drug, can lower selenium levels, although whether that matters clinically is not known,
  and a Cochrane review found too little evidence that selenium eases chemotherapy side effects [1]. If you take
  cisplatin or other medicines regularly, talk to your doctor or pharmacist before taking a selenium supplement.

