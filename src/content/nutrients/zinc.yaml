evidence:
  established: >-
    Zinc is essential for hundreds of enzymes, immune function and growth [1]. In AREDS, 4,757 people aged 50 to
    80 at high risk of advanced macular degeneration who took a daily formula of 80 mg zinc with copper, beta-
    carotene and vitamins C and E for 5 years had a 25% lower risk of advanced disease than those on placebo, and
    AREDS2 confirmed the benefit [1]. The fact sheet advises people with or developing macular degeneration to
    talk to their health care provider about these formulations [1].
  notSupported: >-
    Preventing colds: a 2024 Cochrane review of 34 trials in 8,526 people found that zinc makes little or no
    difference to the chance of catching a cold [1]. Type 2 diabetes: the fact sheet finds the evidence
    insufficient to support any conclusion about zinc supplements and diabetes [1].
  mixed: >-
    Treating colds: the same review found that zinc, mostly as lozenges, may shorten a cold by about 2 days, with
    an unclear effect on how bad the symptoms are — all on low to very low certainty evidence [1]. Childhood
    diarrhea: in low-income countries, where deficiency is common, zinc shortens acute diarrhea, but the effect may
    be marginal in well-nourished children [1].

tooMuch: >-
  High intakes can cause nausea, dizziness, headaches, stomach upset, vomiting and loss of appetite [1]. Taken for
  weeks, 50 mg a day or more — usually from supplements or overuse of zinc-containing denture creams — can block
  copper absorption and cause low copper status, reduce immune function and lower HDL cholesterol [1]. Food rarely
  provides as much as 50 mg, so the zinc in food is unlikely to cause toxicity [1]. Chronic overuse of denture
  creams containing zinc has caused nerve damage and anemia; zinc-free creams are available [1].

interactions: >-
  Quinolone antibiotics such as ciprofloxacin and tetracycline antibiotics can bind zinc in the gut, reducing the
  absorption of both; taking the antibiotic at least 2 hours before or 4 to 6 hours after the zinc supplement
  minimises this [1]. Zinc reduces the absorption and action of penicillamine, used for rheumatoid arthritis and
  Wilson disease, so the two should be taken at least 1 hour apart [1]. Thiazide diuretics such as
  hydrochlorothiazide increase zinc loss in urine [1]. If you take any of these regularly, talk to your doctor or
  pharmacist before taking a zinc supplement.

