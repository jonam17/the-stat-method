draft: false
name: Zinc
kind: mineral
dek: A mineral that hundreds of enzymes need, involved in immune function, protein and DNA synthesis, wound healing and the sense of taste. Oysters and beef are rich sources.
unit: mg

intake:
  type: RDA
  rows:
    - { group: "19–50", male: 11, female: 8, pregnancy: 11, lactation: 12 }
    - { group: "51–70", male: 11, female: 8 }
    - { group: ">70", male: 11, female: 8 }
  eighteenNote: People aged 18 fall in the official 14–18 group — 11 mg a day for males and 9 mg for females, 12 mg in pregnancy and 13 mg when breastfeeding. Its upper limit is 34 mg.

ul:
  rows:
    - { group: "19–50", male: 40, female: 40, pregnancy: 40, lactation: 40 }
    - { group: "51–70", male: 40, female: 40 }
    - { group: ">70", male: 40, female: 40 }
  appliesTo: total
  note: The upper limit covers zinc from food and supplements combined. It is the most that is unlikely to cause harm, not a target, and was set from the amount that harms copper status. It does not apply to people taking zinc as medical treatment, who should be under a doctor's care — the AREDS formula the National Eye Institute recommends for macular degeneration contains 80 mg, twice the limit.

does: >-
  Zinc is needed for the activity of hundreds of enzymes and plays a role in immune function, making protein and
  DNA, wound healing, and cell signalling and division [1]. It supports growth and development during pregnancy,
  infancy, childhood and adolescence, and is involved in the sense of taste [1]. The body holds about 1.5 g in
  women and 2.5 g in men, mostly in muscle and bone [1].

forms: >-
  Supplements contain zinc sulfate, acetate, gluconate and other forms, and the label states the amount of
  elemental zinc, not the weight of the whole compound [1]. About 61% of the zinc in citrate or gluconate is
  absorbed in young adults, and 50% from zinc oxide [1]. Zinc is also in some cold lozenges, nasal sprays,
  homeopathic products and denture adhesive creams [1].

absorption: >-
  The body absorbs from 5% to more than 50% of the zinc in food, depending on how much of the diet is plant-based
  [1]. Beans, nuts and whole grains contain phytates, which bind zinc and block its absorption; soaking beans,
  grains and seeds for several hours before cooking reduces this, and fermented foods might help [1]. Taking an
  iron supplement of 25 mg or more at the same time as zinc can reduce zinc absorption, although the iron in
  fortified foods does not [1].

deficiency: >-
  Zinc deficiency affects many tissues, including the skin, bones, and the digestive, reproductive, nervous and
  immune systems [1]. In children it causes diarrhea, hair loss, delayed growth and frequent infections; it can
  also dull taste and smell, and in older adults delay wound healing and change thinking and mood [1]. In
  populations with little absorbable zinc, deficiency in pregnancy increases the risk of premature birth, low
  birth weight and other adverse outcomes [1]. Serum zinc below 70 mcg/dL in women or 74 mcg/dL in men indicates
  inadequate status, although the test has important limitations [1].

atRisk:
  - People with inflammatory bowel disease — 15% to 40% are zinc deficient — and people with celiac disease or who have had bariatric surgery [1]
  - People who follow vegetarian or vegan diets, whose phytate-rich foods make zinc harder to absorb [1]
  - Pregnant and breastfeeding women, whose requirement rises by 3 and 4 mg a day [1]
  - People with alcohol use disorder — low zinc status is found in 30% to 50% [1]

usIntake: >-
  Most Americans get enough zinc, although older adults may have marginal intakes [1]. Average intake from food is
  13 mg a day for men and 9.2 mg for women, and 16.4 mg and 12.6 mg including supplements [1]. Even so, in
  2005–2016 data, 15% of adults took in less than the average requirement [1]. Oysters contain more zinc per
  serving than any other food, but beef provides 20% of the zinc Americans eat because it is so common, and
  fortified breakfast cereals are a major source [1].

