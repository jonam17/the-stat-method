evidence:
  established: >-
    Copper is essential for enzymes involved in energy production, iron metabolism and connective tissue, and
    deficiency causes anemia, bone defects and other problems [1]. In Menkes disease, copper injections started in
    the first weeks after birth can reduce the risk of death and improve development [1].
  notSupported: >-
    Alzheimer's disease: in a trial in 68 people aged 50 to 80 with mild Alzheimer's disease, 8 mg of copper a day
    for 12 months did not change cognition [1]. Heart disease: a few small studies in healthy adults found little
    evidence that copper supplements affect cardiovascular risk factors, and no trials have been done in people at
    higher risk [1].
  mixed: >-
    Observational studies of copper and heart disease disagree: in an Italian study, people eating the most copper
    had lower blood pressure and cholesterol, but in U.S. and German studies, those with the highest blood copper
    had higher rates of death from heart disease [1]. Studies of Alzheimer's disease conflict too — low copper has
    been found in the brains of people with the disease, but meta-analyses find higher blood copper [1].

tooMuch: >-
  Chronic exposure to high levels of copper can damage the liver and cause abdominal pain, cramps, nausea,
  diarrhea and vomiting [1]. Copper toxicity is rare in healthy people, but it has occurred from drinking water that
  stood in copper pipes and fixtures; the Environmental Protection Agency's recommended limit for public water is
  1.3 mg per litre [1]. People with Wilson's disease, a rare inherited disorder that stops the body clearing copper,
  are at high risk of toxicity and can develop liver and nerve damage [1].

interactions: >-
  Copper is not known to have any clinically relevant interactions with medicines [1]. High-dose zinc supplements,
  though, can reduce copper absorption [1]. If you take medicines or zinc regularly, your doctor or pharmacist can tell you
  whether a supplement suits you.

