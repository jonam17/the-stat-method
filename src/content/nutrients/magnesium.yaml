# Magnesium — every value from the NIH Office of Dietary Supplements Health
# Professional fact sheet (reference 1), updated 6 Jan 2026. Numbered markers
# [n] refer to `references` below. Follow docs/LIBRARY-WORKFLOW.md.
# DRAFT until a person has checked every value against the source.
#
# The fact sheet splits 19–50 into 19–30 and 31–50 with different values, so
# both rows are copied as they are. Its "51+ years" row covers both 51–70 and >70.
draft: false
name: Magnesium
kind: mineral
dek: A mineral that more than 300 enzyme systems depend on — for muscle and nerve function, blood sugar and blood pressure control, energy production and bone.
unit: mg

intake:
  type: RDA
  rows:
    - { group: "19–30", male: 400, female: 310, pregnancy: 350, lactation: 310 }
    - { group: "31–50", male: 420, female: 320, pregnancy: 360, lactation: 320 }
    - { group: "51–70", male: 420, female: 320 }
    - { group: ">70", male: 420, female: 320 }
  eighteenNote: People aged 18 fall in the official 14–18 group — 410 mg a day for males and 360 mg for females, 400 mg in pregnancy and 360 mg when breastfeeding. The upper limit for supplemental magnesium is the same 350 mg.

# The UL table is titled "for Supplemental Magnesium", and the text says the ULs
# "only include magnesium from dietary supplements and medications; they do not
# include magnesium found naturally in food and beverages." Hence supplemental,
# and a limit LOWER than the RDA — correctly.
ul:
  rows:
    - { group: "19–30", male: 350, female: 350, pregnancy: 350, lactation: 350 }
    - { group: "31–50", male: 350, female: 350, pregnancy: 350, lactation: 350 }
    - { group: "51–70", male: 350, female: 350 }
    - { group: ">70", male: 350, female: 350 }
  appliesTo: supplemental
  scope: This limit applies only to magnesium from supplements and medicines — not to magnesium found naturally in food and drink.
  note: The limit is the most magnesium from supplements and medicines a day that is unlikely to cause harm, not a target. It is lower than the recommended amount, and that is correct — the recommended amount counts magnesium from every source, while the limit counts only supplements and medicines. Magnesium from food poses no risk to healthy people, because the kidneys remove the excess.

does: >-
  Magnesium is a cofactor in more than 300 enzyme systems that regulate reactions throughout the body,
  including protein synthesis, muscle and nerve function, blood sugar control and blood pressure
  regulation [1]. It is required for energy production, contributes to the structure of bone, and is
  needed to make DNA, RNA and the antioxidant glutathione [1]. It also helps move calcium and potassium
  across cell membranes, which matters for nerve signals, muscle contraction and a normal heart rhythm
  [1]. An adult body holds about 25 grams, 50% to 60% of it in the bones [1].

forms: >-
  Supplements contain magnesium in several forms, including oxide, citrate and chloride, and the label
  states the amount of magnesium itself, not the weight of the whole compound [1]. Forms that dissolve well
  in liquid are absorbed more completely: small studies have found the aspartate, citrate, lactate and
  chloride forms better absorbed than magnesium oxide and sulfate [1]. Magnesium is also a main ingredient
  in some laxatives and in some remedies for heartburn and indigestion. Phillips' Milk of Magnesia, for
  example, provides 500 mg per tablespoon — well above the upper limit, though some is not absorbed
  because of the laxative effect [1].

absorption: >-
  About 30% to 40% of the magnesium in food and drink is absorbed [1]. Refining grains in ways that remove
  the germ and bran substantially lowers their magnesium [1]. Tap, mineral and bottled water can add some,
  though the amount varies widely by source and brand, from 1 mg to more than 120 mg per liter [1]. One
  study found that very high doses of zinc from supplements — 142 mg a day — interfered with magnesium
  absorption and balance [1]. When magnesium status is low, the kidneys excrete less of it [1].

deficiency: >-
  Deficiency from diet alone is uncommon in otherwise healthy people, because the kidneys limit how much
  is lost in urine [1]. It can follow habitually low intakes, or losses caused by some health conditions,
  chronic alcoholism or certain medicines [1]. Early signs include loss of appetite, nausea, vomiting,
  fatigue and weakness; as it worsens, numbness, tingling, muscle cramps, seizures, personality changes,
  abnormal heart rhythms and coronary spasms can follow, and severe deficiency can cause low blood calcium
  or potassium [1]. Status is hard to measure because most magnesium is inside cells or in bone; blood
  levels are the usual test but reflect the body's total poorly [1].

atRisk:
  - People with gastrointestinal diseases such as Crohn's disease or celiac disease, or who have had part of the small intestine removed or bypassed — chronic diarrhea and fat malabsorption deplete magnesium over time [1]
  - People with type 2 diabetes or insulin resistance, who can lose more magnesium in their urine [1]
  - People with alcohol dependence, in whom magnesium deficiency is common [1]
  - Older adults, who eat less magnesium, absorb less of it and lose more in urine, and are more likely to have conditions or take medicines that affect it [1]

usIntake: >-
  Many Americans get less magnesium from food than they need: in national survey data from 2013–2016, 48%
  of people of all ages took in less than their estimated average requirement from food and drink, with
  men 71 and older and teenagers most likely to fall short [1]. In 2003–2006 data, adults who took a
  magnesium supplement also ate more from food — 350 mg a day for men and 267 mg for women, against 268 mg
  and 234 mg for those who did not — and their totals including supplements averaged 449 mg and 387 mg [1].
  There are no current data on magnesium status in the United States: the national survey has not measured
  blood magnesium since 1974, and routine hospital and clinic blood tests do not include it [1].

