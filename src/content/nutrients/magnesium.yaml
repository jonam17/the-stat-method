evidence:
  established: >-
    Magnesium is essential: more than 300 enzyme systems depend on it, and it is needed to build bone [1].
    The fact sheet states that diets providing the recommended amounts enhance bone health [1].
  notSupported: >-
    Blood sugar control in diabetes: the American Diabetes Association states that the evidence is
    insufficient to support routine use of magnesium to improve glycemic control [3], and the few small,
    short trials have had conflicting results [1]. Blood pressure: trials find only a marginal effect — a
    Cochrane review of 12 trials in 545 people with high blood pressure, who took about 243 to 973 mg a day
    for 8 to 26 weeks, found a reduction of only 2.2 mmHg in diastolic pressure [2]. The FDA allows foods and
    supplements to say that adequate magnesium may reduce the risk of high blood pressure, but only together
    with its own conclusion that the evidence is inconsistent and inconclusive [1].
  mixed: >-
    Heart disease and stroke: in several long-term observational studies, people with higher magnesium
    intakes or blood levels had lower rates of sudden cardiac death, heart disease or stroke, but such
    studies cannot rule out other dietary factors, and a large, well-designed trial is still needed [1].
    Type 2 diabetes risk: in a meta-analysis of cohort studies, each extra 100 mg a day was associated with a
    15% lower risk, with the same limitation [1]. Bone: higher intakes are associated with greater bone
    density, and a few small studies suggest more magnesium might increase it in postmenopausal women, but
    its role in preventing osteoporosis needs more research [1]. Migraine: three of four small, short trials
    found modest reductions in how often migraines occurred, and the American Academy of Neurology and the
    American Headache Society concluded that magnesium is probably effective for prevention [4] — but the
    amounts typically used exceed the upper limit, so the fact sheet says this should be done only under a
    health care provider's direction and supervision [1].

tooMuch: >-
  Magnesium from food is not a risk for healthy people, because the kidneys remove the excess in urine [1].
  High doses from supplements or medicines often cause diarrhea, sometimes with nausea and abdominal
  cramping — most commonly reported with magnesium carbonate, chloride, gluconate and oxide [1]. Very large
  doses from laxatives and antacids, typically more than 5,000 mg a day, have caused magnesium toxicity,
  including deaths [1]. Its signs include low blood pressure, nausea, vomiting, facial flushing, urine
  retention and lethargy, progressing to muscle weakness, difficulty breathing, irregular heartbeat and
  cardiac arrest [1]. The risk is greater when kidney function is impaired, because the kidneys cannot
  remove the excess [1].

interactions: >-
  Magnesium-rich supplements or medicines can reduce the absorption of oral bisphosphonates for
  osteoporosis, such as alendronate (Fosamax); taking them at least 2 hours apart minimises this [1].
  Magnesium binds tetracycline antibiotics such as doxycycline and quinolones such as ciprofloxacin, which
  should be taken at least 2 hours before or 4 to 6 hours after a magnesium supplement [1]. Long-term use of
  loop and thiazide diuretics, such as furosemide and hydrochlorothiazide, increases the magnesium lost in
  urine, while potassium-sparing diuretics such as spironolactone reduce it [1]. Proton pump inhibitors such
  as esomeprazole and lansoprazole can cause low blood magnesium when taken for long periods, typically more
  than a year; in the cases the FDA reviewed, supplements often corrected it but in a quarter did not and the
  drug had to be stopped, and the FDA advises doctors to consider checking magnesium before and during
  long-term treatment [5]. If you take any of these regularly, talk to your doctor or pharmacist before
  taking a magnesium supplement.

