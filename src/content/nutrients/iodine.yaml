    - { group: "51–70", male: 150, female: 150 }
    - { group: ">70", male: 150, female: 150 }
  eighteenNote: People aged 18 fall in the official 14–18 group, which has the same values — 150 mcg a day, 220 mcg in pregnancy and 290 mcg when breastfeeding. Its upper limit is 900 mcg.

ul:
  warning: "Safe for most people is not safe for everyone. People with autoimmune thyroid disease may be harmed by amounts of iodine that are safe for others, and high-dose iodine taken with antithyroid medicine such as methimazole can cause hypothyroidism. If you have a thyroid condition, talk to your doctor before taking an iodine supplement."
  rows:
    - { group: "19–50", male: 1100, female: 1100, pregnancy: 1100, lactation: 1100 }
    - { group: "51–70", male: 1100, female: 1100 }
    - { group: ">70", male: 1100, female: 1100 }
  appliesTo: total
  note: The upper limit covers iodine from food and supplements combined. It is the most that is unlikely to cause harm, not a target; long-term intakes above it increase the risk of adverse effects. Some people, such as those with autoimmune thyroid disease, may be harmed by intakes considered safe for others. The limit does not apply to people receiving iodine as medical treatment, who should be under a doctor's care.

does: >-
  Iodine is an essential part of the thyroid hormones thyroxine (T4) and triiodothyronine (T3), which regulate
  many reactions, including protein synthesis and enzyme activity, and are critical to metabolic activity [1].
  They are also needed for normal development of the skeleton and nervous system in fetuses and infants [1]. A
  healthy adult holds about 15 to 20 mg of iodine, 70% to 80% of it in the thyroid [1].

forms: >-
  In food and iodized salt, iodine occurs as several salts, mostly iodide and iodate, which are almost completely
  absorbed [1]. Supplements usually contain potassium or sodium iodide, or kelp; many multivitamins provide 150 mcg,
  and some iodine-only supplements contain more than the upper limit [1].

absorption: >-
  Iodized salt in the United States provides about 45 mcg per gram, but most salt Americans eat comes from processed
  foods, which almost always use noniodized salt [1]. Sea salt, kosher salt and other specialty salts are not
  usually iodized [1]. The iodine in dairy depends on the iodine fed to cows and the sanitisers used, the iodine in
  plants on the soil, and most bread contains very little unless it is made with an iodate dough conditioner [1].

deficiency: >-
  Iodine deficiency is the most common cause of preventable intellectual disability in the world [1]. The earliest
  sign is usually goiter, an enlarged thyroid, and intakes below about 10 to 20 mcg a day cause hypothyroidism [1].
  In pregnancy, deficiency of this degree can cause serious developmental problems in the fetus, miscarriage and
  stillbirth; milder deficiency in children may lower IQ, and in adults causes goiter and impaired mental function
  [1]. Overt deficiency is now uncommon in North America [1].

atRisk:
  - People who do not use iodized salt [1]
  - Pregnant women — the requirement rises from 150 to 220 mcg, and many in the United States may fall short [1]
  - Vegans and people who eat few or no dairy products, seafood and eggs [1]
  - People living where soils are low in iodine, such as mountainous regions and flood-prone river valleys [1]
  - People with marginal iodine status who eat a lot of goitrogens, found in soy, cassava and cruciferous vegetables such as cabbage and broccoli — not a concern for most Americans [1]

usIntake: >-
  The U.S. population as a whole gets enough iodine: in 2008–2012 data, average intake was 216 mcg a day, without
  counting iodized salt added at home [1]. Urinary iodine has been stable since 2000 [1]. Some pregnant women may not
  get enough, especially those who eat no dairy: their median urinary iodine was 100 mcg/L, against 163 mcg/L in
  those who did [1].

