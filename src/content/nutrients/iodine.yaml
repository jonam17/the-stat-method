evidence:
  established: >-
    Iodine is essential for thyroid hormones, and severe deficiency causes goiter, hypothyroidism and, before birth,
    lasting harm to development [1]. Salt iodization has dramatically reduced iodine deficiency worldwide [1].
  notSupported: >-
    Child development from supplements in pregnancy: two trials that gave 150 or 200 mcg a day from early pregnancy
    found no effect on children's cognitive, language or motor scores at age 1.5 to 2, and one still found none at 5
    to 6 [1].
  mixed: >-
    In New Zealand, 184 mildly iodine-deficient children aged 10 to 13 who took 150 mcg a day for 28 weeks improved
    in some measures of cognition [1]. Small trials in fibrocystic breast disease found less pain with iodine, but at
    1,500 to 6,000 mcg a day — several times the upper limit — which the fact sheet says should be taken only under a
    doctor's guidance [1].

disagreements: >-
  The World Health Organization recommends 250 mcg a day during pregnancy and breastfeeding, slightly more than the
  U.S. 220 mcg in pregnancy [1]. The American Thyroid Association recommends that women who are planning a pregnancy,
  pregnant or breastfeeding take a supplement of 150 mcg a day, and the American Academy of Pediatrics recommends at
  least 150 mcg a day with iodized salt [1]. Yet in 2011–2014, only 17.8% of pregnant women who took a supplement took
  one containing iodine [1].

tooMuch: >-
  Too much iodine can cause some of the same problems as too little — goiter, raised thyroid-stimulating hormone and
  hypothyroidism — and can also cause hyperthyroidism, thyroiditis and thyroid papillary cancer [1]. Acute poisoning
  is rare, usually from doses of many grams, and causes burning of the mouth, throat and stomach, fever, nausea,
  vomiting, diarrhea, weak pulse and coma [1]. In most people, intakes from food and supplements are unlikely to
  exceed the upper limit [1].

interactions: >-
  High doses of iodine taken with antithyroid medicines such as methimazole (Tapazole) can have an additive effect
  and could cause hypothyroidism [1]. Potassium iodide taken with ACE inhibitors such as lisinopril, or with
  potassium-sparing diuretics such as spironolactone, can raise blood potassium too high [1]. If you take any of
  these regularly, talk to your doctor or pharmacist before taking an iodine supplement.

