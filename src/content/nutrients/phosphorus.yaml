draft: false
name: Phosphorus
kind: mineral
dek: A mineral in bones, teeth, DNA and ATP, the body's energy currency. Most Americans get more than they need, partly from phosphate additives in processed food.
unit: mg

intake:
  type: RDA
  rows:
    - { group: "19–50", male: 700, female: 700, pregnancy: 700, lactation: 700 }
    - { group: "51–70", male: 700, female: 700 }
    - { group: ">70", male: 700, female: 700 }
  eighteenNote: People aged 18 fall in the official 14–18 group, which needs much more — 1,250 mg a day, including in pregnancy and when breastfeeding. Its upper limit is 4,000 mg, or 3,500 mg in pregnancy.

ul:
  rows:
    - { group: "19–50", male: 4000, female: 4000, pregnancy: 3500, lactation: 4000 }
    - { group: "51–70", male: 4000, female: 4000 }
    - { group: ">70", male: 3000, female: 3000 }
  appliesTo: total
  note: The upper limit covers phosphorus from food and supplements combined, and is lower in pregnancy and after 70. It is the most that is unlikely to cause harm, not a target, and was based on intakes that keep blood phosphate normal. It does not apply to people taking phosphorus under medical supervision.

does: >-
  Phosphorus is part of bones, teeth, DNA and RNA, of cell membranes, and of ATP, the body's key energy source [1].
  It helps regulate gene transcription, activate enzymes, keep the fluid outside cells at a normal pH and store
  energy inside them [1]. About 85% of the body's phosphorus is in bones and teeth [1]. Its metabolism is linked
  with calcium's, through vitamin D and parathyroid hormone [1].

forms: >-
  Food contains phosphorus mainly as phosphates; in seeds and unleavened bread it is phytic acid, much of which humans
  cannot absorb [1]. Phosphate additives such as phosphoric acid and sodium phosphate are common in processed food
  and may provide 300 to 1,000 mg a day — 10% to 50% of intake in Western countries — and their use is rising [1].
  Supplements usually contain phosphate salts or phospholipids [1].

absorption: >-
  The body absorbs 40% to 70% of the phosphorus naturally in food, more from animal than plant sources, and about
  70% from phosphate additives and supplement salts [1]. Calcium binds some phosphorus in food and prevents its
  absorption [1].

deficiency: >-
  Phosphorus deficiency (hypophosphatemia) is rare in the United States and almost never caused by diet [1]. It can
  cause loss of appetite, anemia, muscle weakness, bone pain, rickets and osteomalacia, more infections, tingling,
  poor coordination and confusion [1]. It is usually caused by medical conditions such as hyperparathyroidism,
  kidney tubule defects and diabetic ketoacidosis [1].

atRisk:
  - People with rare genetic disorders of phosphate regulation, such as X-linked hypophosphatemic rickets [1]
  - People with severe malnutrition — from chronic disease, anorexia nervosa, heavy drinking or other causes — who can develop dangerously low phosphate (refeeding syndrome) when feeding restarts; phosphorus and thiamin given in advance can prevent it [1]

usIntake: >-
  Most Americans get more than the recommended amount: in 2015–2016, average intake from food was 1,596 mg a day for
  men and 1,189 mg for women [1]. These surveys may underestimate true intake, because they do not capture phosphate
  additives [1]. Dairy products provide about 20% of the phosphorus Americans eat, and bakery products 10% [1].

sources:
  rule: The five foods with the most phosphorus per serving in the NIH fact sheet's food table. Fortified foods are marked.
  foods:
