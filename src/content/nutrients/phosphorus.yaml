evidence:
  established: >-
    Phosphorus is essential for bones, teeth, DNA and energy metabolism [1]. In chronic kidney disease the kidneys
    cannot remove phosphate efficiently, blood levels rise, and in people on dialysis the highest phosphate levels
    are linked to a 39% higher risk of death [1].
  notSupported: >-
    There is no evidence on whether restricting phosphorus prevents cardiovascular disease in healthy adults [1].
    In people with milder chronic kidney disease, higher phosphorus intakes were not linked to higher mortality [1].
  mixed: >-
    Observational studies link higher blood phosphate with cardiovascular disease and death in healthy adults, but
    not all agree [1]. In U.S. adults, intakes of 1,000 mg a day or more — twice the recommended amount but well
    below the limit — were linked to higher death rates, which may reflect diets unhealthy in other ways [1]. For
    severe kidney disease, a guideline group weakly recommends limiting dietary phosphorus [1].

tooMuch: >-
  High phosphorus intakes rarely harm healthy people [1]. Very large amounts over a short time — such as two 6,600 mg
  doses of sodium phosphate in a day — can cause hyperphosphatemia, which disturbs the hormones that regulate calcium
  and can calcify soft tissues, especially the kidneys [1].

interactions: >-
  Antacids containing aluminum hydroxide bind phosphorus and, used for 3 months or more, can cause low phosphate;
  calcium carbonate antacids also reduce its absorption [1]. Laxatives containing sodium phosphate raise blood
  phosphate, and after 13 reported deaths from a single dose above the label's, the FDA warned that they are
  potentially dangerous above recommended doses, especially with kidney disease, heart disease or dehydration [1].
  If you take any of these regularly, talk to your doctor or pharmacist.

