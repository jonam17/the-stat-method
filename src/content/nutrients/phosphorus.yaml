    - { food: "Milk, 2% milkfat", short: "Milk, 2%", serving: "1 cup", amount: 226 }
    - { food: "Salmon, Atlantic, farmed, cooked", short: "Salmon, farmed", serving: "3 ounces", amount: 214 }
