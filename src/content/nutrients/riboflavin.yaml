evidence:
  established: >-
    Riboflavin is essential for the coenzymes FMN and FAD, which energy production and the metabolism of other
    B vitamins depend on; severe deficiency impairs the metabolism of other nutrients [1]. In riboflavin
    transporter deficiency, high-dose riboflavin can be a life-saving treatment, especially when started soon
    after symptoms begin [1].
  notSupported: >-
    Cancer prevention: data are limited and findings mixed — large observational studies disagree on lung and
    colorectal cancer, and the fact sheet says clinical trials are needed to find out whether supplements reduce
    cancer risk [1].
  mixed: >-
    Migraine: in a trial in 55 adults with migraine, 400 mg a day reduced attacks by two a month compared with
    placebo, but two small trials in children found that 50 to 200 mg a day did not reduce headaches [1]. The
    American Academy of Neurology and the American Headache Society concluded that riboflavin is probably
    effective for preventing migraine, and the Canadian Headache Society recommends it while calling the
    evidence low quality [1].

tooMuch: >-
  Intakes from food many times the recommended amount show no toxicity, possibly because riboflavin is poorly
  soluble and its absorption is limited [1]. No harm has been reported from 400 mg a day for at least 3 months,
  although the Food and Nutrition Board urges caution about excessive amounts [1].

interactions: >-
  Riboflavin is not known to have any clinically relevant interactions with medicines [1]. If you take medicines
  regularly, your doctor or pharmacist can still tell you whether any supplement suits you.

