  rule: The five foods with the most vitamin C per serving in the NIH fact sheet's food table. Fortified foods are marked.
  foods:
    - { food: "Red pepper, sweet, raw", short: "Red pepper, raw", serving: "½ cup", amount: 95 }
    - { food: "Orange juice", serving: "¾ cup", amount: 93 }
    - { food: "Orange", serving: "1 medium", amount: 70 }
    - { food: "Grapefruit juice", serving: "¾ cup", amount: 70 }
    - { food: "Kiwifruit", serving: "1 medium", amount: 64 }

evidence:
  established: >-
    Vitamin C prevents and cures scurvy; in the mid-1700s, James Lind showed that citrus fruit cured it, although
    ascorbic acid was not proven to be the active component until 1932 [1]. The recommended amounts are based on
    vitamin C's functions in white blood cells and are much higher than the amount needed to prevent deficiency
    [1].
  notSupported: >-
    The common cold in the general population: a 2007 Cochrane review found that taking at least 200 mg a day did
    not reduce the risk of catching a cold, and taking it after symptoms began did not shorten colds or ease
    symptoms [1]. Cancer prevention: most trials, usually of vitamin C with other nutrients, found no effect —
    in the Physicians' Health Study II, 500 mg a day with vitamin E every other day for a mean of 8 years did not
    reduce prostate or total cancer [1]. Heart disease: in the Women's Antioxidant Cardiovascular Study, 8,171
    women aged 40 and older with a history of cardiovascular disease took 500 mg a day for a mean of 9.4 years
    with no overall effect on cardiovascular events, and 500 mg a day had no effect on major cardiovascular
    events in the Physicians' Health Study II [1]. Cataracts: in AREDS, 500 mg of vitamin C with vitamin E and
    beta-carotene for an average of 6.3 years did not lower the risk of cataracts [1].
  mixed: >-
    The common cold under physical stress: in trials of marathon runners, skiers and soldiers exposed to extreme
    exercise or cold, 250 mg to 1 g a day halved the number of colds, and in the general population regular
    vitamin C shortened colds modestly — by 8% in adults and 14% in children [1]. Age-related macular
    degeneration: vitamin C has not been shown to prevent AMD, but in AREDS, people at high risk of advanced AMD
    who took 500 mg of vitamin C with vitamin E, beta-carotene, zinc and copper had a 28% lower risk of
    progressing to it over an average of 6.3 years [1]. Diet and disease: observational studies link diets high
    in vitamin C, fruit and vegetables with lower risks of several cancers and of heart disease, but the results
    of prospective studies are inconsistent, and many trials may have started with people whose vitamin C levels
    were already near saturation [1].

tooMuch: >-
  Vitamin C has low toxicity and is not believed to cause serious harm at high intakes [1]. The most common
  complaints are diarrhea, nausea, abdominal cramps and other digestive upsets, from unabsorbed vitamin C in the
  gut [1]. High intakes could raise oxalate and uric acid in urine and contribute to kidney stones, although
  studies conflict; the best evidence is in people with pre-existing hyperoxaluria [1]. Because vitamin C
  increases iron absorption, chronic high doses could worsen iron overload in people with hereditary
  hemochromatosis [1].

interactions: >-
  The safety of vitamin C and other antioxidants during cancer treatment is controversial: some data suggest they
  might protect tumour cells from radiation and chemotherapy drugs, and people having chemotherapy or radiation
  should consult their oncologist before taking vitamin C or other antioxidant supplements, especially in high
  doses [1]. Vitamin C combined with other antioxidants may blunt the rise in HDL cholesterol from combined niacin
  and simvastatin (Zocor) therapy, and health care providers should monitor lipid levels in people taking both
  statins and antioxidant supplements [1]. If you take any of these regularly, talk to your doctor or pharmacist
  before taking a vitamin C supplement.

