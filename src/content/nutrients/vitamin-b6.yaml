evidence:
  established: >-
    Vitamin B6 is needed for more than 100 enzyme reactions, and too little causes anemia, skin and mouth
    changes, depression and confusion [1]. The recommended amounts were calculated to keep blood PLP at 20
    nmol/L or more [1].
  notSupported: >-
    Heart disease: B vitamins lower homocysteine, but most large trials have not found that they reduce
    cardiovascular events [1]. In a combined analysis of two Norwegian trials in 6,837 patients with ischemic
    heart disease, 40 mg of vitamin B6 a day, with or without folic acid and vitamin B12, had no benefit on major
    cardiovascular events [1]. Cancer: the same Norwegian trials found no link between vitamin B6 supplements and
    cancer or deaths [1]. Cognition: a systematic review of 14 trials found insufficient evidence that vitamin B6,
    alone or with vitamin B12 or folic acid, affects cognitive function [1].
  mixed: >-
    Premenstrual syndrome: a meta-analysis of nine trials in almost 1,000 women found vitamin B6 more effective
    than placebo, but most studies were small and several had weaknesses; in a later trial in 94 women, 80 mg a
    day over three cycles reduced a broad range of symptoms [1]. Nausea in pregnancy: two trials found that 30 to
    75 mg a day reduced nausea, but a Cochrane review could not draw firm conclusions; vitamin B6 combined with
    the antihistamine doxylamine reduced nausea and vomiting by 70% in trials [1]. The American College of
    Obstetricians and Gynecologists recommends vitamin B6 as a first treatment, and the fact sheet advises
    pregnant women to consult a physician first, because the doses could approach the upper limit [1].

disagreements: >-
  In 2023, the European Food Safety Authority set an upper limit for vitamin B6 of 12 mg a day for all adults,
  including women who are pregnant or breastfeeding, based on systematic reviews of vitamin B6 and nerve damage
  [1]. That is about an eighth of the U.S. limit of 100 mg [1].

tooMuch: >-
  Vitamin B6 from food has not been reported to cause harm [1]. Taking 1 to 6 g of pyridoxine a day for 12 to 40
  months can cause severe, progressive sensory neuropathy — nerve damage with loss of control of body movements
  — which usually stops if the supplements are stopped as soon as symptoms appear [1]. Several reports describe
  neuropathy at doses below 500 mg a day [1]. Excess vitamin B6 can also cause painful, disfiguring skin lesions,
  sensitivity to light, nausea and heartburn [1].

interactions: >-
  Cycloserine (Seromycin), an antibiotic used for tuberculosis, increases the loss of vitamin B6 in urine, which
  might worsen the drug's seizures and nerve toxicity; vitamin B6 supplements can help prevent this [1].
  Antiepileptic drugs such as valproic acid, carbamazepine and phenytoin lower blood PLP and raise homocysteine,
  and 200 mg a day of pyridoxine can lower blood levels of phenytoin and phenobarbital [1]. Theophylline, used for
  asthma and other lung diseases, is often accompanied by low blood PLP, which could contribute to its side
  effects, including seizures [1]. If you take any of these regularly, talk to your doctor or pharmacist before
  taking a vitamin B6 supplement.

