# The text: "The FNB has established ULs for vitamin B6 that apply to both food
# and supplement intakes", set by halving 200 mg/day, a dose at which studies
# found no sensory neuropathy; "The ULs do not apply to individuals receiving
# vitamin B6 for medical treatment". EFSA's 2023 limit of 12 mg is in
# `disagreements`.
ul:
  rows:
    - { group: "19–50", male: 100, female: 100, pregnancy: 100, lactation: 100 }
    - { group: "51–70", male: 100, female: 100 }
    - { group: ">70", male: 100, female: 100 }
  appliesTo: total
  note: The upper limit covers vitamin B6 from food and supplements combined. It is the most that is unlikely to cause harm, not a target. It was set to guard against nerve damage, at half the dose that studies over up to 5 years found no evidence of it. It does not apply to people taking vitamin B6 as medical treatment, who should be under a doctor's care. The European Food Safety Authority set a much lower limit in 2023 — see Where official guidance disagrees, below.

does: >-
  Vitamin B6 is the name for six related compounds, including pyridoxine; their active coenzyme forms are
  pyridoxal 5'-phosphate (PLP) and pyridoxamine 5'-phosphate [1]. It takes part in more than 100 enzyme
  reactions, mostly in protein metabolism, and is also involved in the metabolism of carbohydrates and fats
  [1]. It helps make neurotransmitters, keeps blood homocysteine at normal levels, and is involved in making
  glucose, immune function and forming hemoglobin [1].

forms: >-
  The most common form in supplements is pyridoxine hydrochloride, although some contain PLP [1].
  Absorption from supplements is similar to absorption from food and does not differ much between forms;
  the body absorbs large doses well but quickly excretes most of the excess in urine [1]. About 28% to 36% of
  people take a supplement containing vitamin B6 [1].

absorption: >-
  About 75% of the vitamin B6 in a mixed diet is available to the body [1]. Much of the pyridoxine naturally
  present in fruits, vegetables and grains is in forms that are less available [1].

deficiency: >-
  Isolated deficiency is uncommon; low vitamin B6 usually comes with low levels of other B vitamins, such as
  vitamin B12 and folic acid [1]. Deficiency is associated with microcytic anemia, abnormal brain-wave
  recordings, dermatitis with scaling on the lips and cracks at the corners of the mouth, a swollen tongue,
  depression and confusion, and weakened immune function [1]. People with borderline status or mild deficiency
  might have no signs for months or even years [1]. Kidney disease, malabsorption syndromes such as celiac
  disease, Crohn's disease and ulcerative colitis, some genetic diseases and some medicines, such as
  antiepileptic drugs, can cause deficiency [1].

atRisk:
  - People with poor kidney function, including those on dialysis or who have had a kidney transplant [1]
  - People with autoimmune disorders, including rheumatoid arthritis, celiac disease and inflammatory bowel disease [1]
  - People with alcohol dependence, in whom blood PLP tends to be very low [1]

usIntake: >-
  Most Americans get the recommended amount: average intake is about 2 mg a day for men and 1.5 mg for women
  [1]. Even so, in 2003–2004 data, 24% of people who did not take a supplement containing vitamin B6, and 11% of
  those who did, had low blood PLP (below 20 nmol/L) — some even at intakes of 2.0 to 2.9 mg a day, above the
  recommended amount [1]. Levels were lower in women than men, in non-Hispanic black than non-Hispanic white
  people, in current smokers and in people who were underweight; the authors concluded that the recommended
  amounts might not guarantee adequate status in many groups [1].

