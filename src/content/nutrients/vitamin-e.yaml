evidence:
  established: >-
    Vitamin E is an essential antioxidant, and deficiency damages nerves and muscles [1]. The recommended
    amounts rest on blood levels that protect red blood cells in a laboratory test, and the Food and
    Nutrition Board acknowledged great uncertainty in those data [1].
  notSupported: >-
    Heart disease: in HOPE, almost 10,000 patients at high risk of heart attack or stroke took 400 IU of
    natural vitamin E (268 mg) a day or a placebo for 4.5 years with no fewer cardiovascular events; in the
    HOPE-TOO extension, after 7 years, those on vitamin E were 13% more likely to develop heart failure [1].
    In almost 15,000 male physicians aged 50 and older, 400 IU of synthetic vitamin E (180 mg) every other day
    for a mean of 8 years did not prevent major cardiovascular events and was linked to more hemorrhagic
    strokes [1]. Cancer: in SELECT, 35,533 healthy men aged 50 and older took 400 IU of synthetic vitamin E (180
    mg) a day, with or without selenium; it did not prevent prostate cancer, and after further follow-up the men
    who had taken vitamin E alone had 17% more prostate cancer [1]. The fact sheet concludes that the evidence
    does not support taking vitamin E to prevent cancer [1]. Cognitive decline: most research does not support
    vitamin E supplements to maintain cognitive performance in healthy or mildly impaired people [1].
  mixed: >-
    In the Women's Health Study, almost 40,000 healthy women aged 45 and older took 600 IU of natural vitamin E
    (402 mg) every other day or a placebo for an average of 10 years: overall cardiovascular events did not
    differ, but cardiovascular deaths were 24% lower [1]. Age-related macular degeneration: in AREDS, people at
    high risk of advanced AMD who took a daily supplement containing vitamin E (180 mg), beta-carotene, vitamin
    C, zinc and copper for 5 years had a 25% lower risk of advanced AMD, but two other trials of vitamin E
    supplements found no protective effect, and AREDS found no effect on cataracts [1]. Alzheimer's disease: in 341 patients with
    moderately severe disease, 2,000 IU of synthetic vitamin E a day for 2 years delayed functional decline, but
    those taking it had more falls [1].

tooMuch: >-
  No adverse effects from vitamin E in food have been found [1]. High doses of supplemental alpha-tocopherol
  can cause bleeding and interfere with blood clotting: two trials found more hemorrhagic strokes — one in
  Finnish male smokers taking 50 mg a day for an average of 6 years, the other in U.S. male physicians taking 180
  mg of synthetic vitamin E every other day for 8 years, most of whom were also taking aspirin [1]. Two
  meta-analyses of trials linked vitamin E supplements to small but significant increases in deaths from any
  cause, one starting at 150 IU a day; the fact sheet calls the implications unclear, because the participants
  were typically middle-aged or older with chronic disease, and a review of trials in healthy people found no
  convincing increase [1]. In SELECT, 400 IU (180 mg) of synthetic vitamin E a day increased the risk of
  prostate cancer [1].

interactions: >-
  Vitamin E can inhibit platelet clumping and work against vitamin K-dependent clotting factors, so large doses
  taken with anticoagulant or antiplatelet drugs such as warfarin (Coumadin) can increase the risk of bleeding,
  especially with low vitamin K intake; the amount needed is unknown but probably above 400 IU a day [1].
  Antioxidant combinations including vitamin E blunted the rise in HDL cholesterol in people taking simvastatin
  (Zocor) with niacin [1]. Oncologists generally advise against antioxidant supplements during chemotherapy or
  radiotherapy, because they might make the treatment less effective [1]. If you take any of these regularly,
  talk to your doctor or pharmacist before taking a vitamin E supplement.

