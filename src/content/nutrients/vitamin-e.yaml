draft: false
name: Vitamin E
kind: vitamin
dek: A group of fat-soluble antioxidants. Only one form, alpha-tocopherol, meets the body's needs; nuts, seeds and vegetable oils are among the best sources.
unit: mg

intake:
  type: RDA
  rows:
    - { group: "19–50", male: 15, female: 15, pregnancy: 15, lactation: 19 }
    - { group: "51–70", male: 15, female: 15 }
    - { group: ">70", male: 15, female: 15 }
  note: Amounts are mg of alpha-tocopherol, the only form of vitamin E the recommendations count. 1 mg is 1 mg of the natural form (RRR-alpha-tocopherol, labelled d-alpha-tocopherol) or 2 mg of the synthetic form (all rac-alpha-tocopherol, labelled dl-alpha-tocopherol), which is half as active. Older labels used International Units — 1 mg equals 1.49 IU of the natural form or 2.22 IU of the synthetic form.
  eighteenNote: People aged 18 fall in the official 14–18 group, which has the same values — 15 mg a day, and 19 mg when breastfeeding. Its upper limit for supplemental vitamin E is lower, at 800 mg.

