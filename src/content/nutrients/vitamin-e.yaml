ul:
  warning: "Below the limit is not safe for everyone. Large doses of vitamin E taken with warfarin or another blood thinner can increase the risk of bleeding, probably from above 400 IU a day, well under the upper limit. Talk to your doctor before taking vitamin E with a blood thinner."
  rows:
    - { group: "19–50", male: 1000, female: 1000, pregnancy: 1000, lactation: 1000 }
    - { group: "51–70", male: 1000, female: 1000 }
    - { group: ">70", male: 1000, female: 1000 }
  appliesTo: supplemental
  scope: This limit applies only to supplemental alpha-tocopherol, natural or synthetic — not to vitamin E found naturally in food.
  note: The limit is the most supplemental vitamin E a day that is unlikely to cause harm, not a target; it was set because high doses can cause bleeding. 1,000 mg is 1,500 IU of the natural form or 1,100 IU of the synthetic form. Two meta-analyses have linked vitamin E supplements to slightly higher death rates at doses below the limit, although what that means is unclear — see Too much, below.

does: >-
  Vitamin E is the name for a group of fat-soluble compounds with antioxidant activity: four tocopherols
  and four tocotrienols [1]. Only alpha-tocopherol is recognised as meeting human requirements, because
  the liver releases it into the blood and breaks down the other forms [1]. As an antioxidant, it stops
  the production of reactive oxygen species that form when fat is oxidised [1]. It is also involved in
  immune function and, mainly in studies of cells, in cell signalling and the regulation of gene expression
  [1]. It helps the lining of blood vessels resist blood cells sticking to it, and helps dilate blood
  vessels and inhibit the clumping of platelets [1].

forms: >-
  Natural vitamin E is RRR-alpha-tocopherol, usually labelled d-alpha-tocopherol; the synthetic form is all
  rac-alpha-tocopherol, labelled dl-alpha-tocopherol, and is only half as active by weight [1]. Most vitamin
  E in American diets is gamma-tocopherol from soybean, canola, corn and other vegetable oils, but the
  recommendations count only alpha-tocopherol [1]. Supplements usually provide only alpha-tocopherol, often
  as an ester (alpha-tocopheryl acetate or succinate), which the body absorbs as well as alpha-tocopherol
  itself [1]. Most vitamin E-only supplements provide 67 mg (100 IU of the natural form) or more — far above
  the recommended amount [1].

absorption: >-
  The digestive tract needs fat to absorb vitamin E, so people with fat-malabsorption disorders are more
  likely to become deficient [1]. People with Crohn's disease, cystic fibrosis or an inability to secrete
  bile sometimes need water-soluble forms of vitamin E [1].

deficiency: >-
  Frank deficiency is rare, and overt symptoms have not been found in healthy people who get little vitamin E
  from their diets [1]. Deficiency is more likely in people with fat-malabsorption disorders, and its
  symptoms include peripheral neuropathy (nerve damage), ataxia (loss of control of movement), muscle
  weakness, damage to the retina and impaired immune response [1]. Two rare inherited disorders —
  abetalipoproteinemia, which impairs fat absorption, and ataxia with vitamin E deficiency (AVED), in which
  the liver's transfer protein is missing or defective — cause deficiency severe enough to damage nerves
  unless very large doses of vitamin E are taken [1].

atRisk:
  - People with fat-malabsorption disorders, such as Crohn's disease or cystic fibrosis, or an inability to secrete bile — the gut needs fat to absorb vitamin E [1]
  - People with the rare inherited disorders abetalipoproteinemia and ataxia with vitamin E deficiency (AVED) [1]

usIntake: >-
  Three national surveys have found that most Americans' diets provide less than the recommended amount of
  vitamin E, but these estimates might be low, because the amounts and types of fat added in cooking are
  often unknown [1]. The Food and Nutrition Board suggests that average intakes among healthy adults are
  probably above the recommended amount, but cautions that low-fat diets might provide too little unless
  food is chosen carefully, for example by eating more nuts, seeds, fruits and vegetables [1]. In 1999–2000,
  11.3% of adults took vitamin E supplements containing at least 400 IU [1].

