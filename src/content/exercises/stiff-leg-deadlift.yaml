# Hamstrings and glutes · Stiff-leg deadlift. Sources read 2026-10-15, published version
# checked 2026-10-16 — see docs/citation-reviews/exercises-hamstrings-glutes.md.
name: Stiff-leg deadlift
group: hamstrings-glutes
dek: A hip hinge with nearly straight knees. In a nine-week randomised trial it grew the hamstrings by about 7%, most of all the semimembranosus.
primary: [Hamstrings]
secondary: [Glutes, Lower back (spinal erectors)]
equipment: [barbell]
progressionClass: large_compound
whyHere: >-
  The stiff-leg deadlift bends at the hips with the knees only slightly unlocked, loading the hamstrings
  through a long stretch with a barbell. In a nine-week blinded randomised trial with a group that did not
  train, it grew the hamstrings by about 7%. It grew mostly the semimembranosus, where the Nordic curl grew
  mostly the semitendinosus, and the authors recommend using both [1].
evidence:
  - kind: training
    claim: >-
      Thirty-six adults without resistance-training experience were assigned to stiff-leg deadlifts,
      Nordic curls or no training, three times a week for nine weeks. Both exercises grew the whole
      hamstrings significantly — stiff-leg deadlifts by about 7%, Nordic curls by about 11% — but each
      favoured a different muscle: the semimembranosus grew about 11% with stiff-leg deadlifts, the
      semitendinosus about 24% with Nordic curls [1].
howTo:
  - Stand with your feet about shoulder width apart, holding the bar in front of your thighs.
  - With your knees only slightly unlocked and your back neutral, push your hips back and lower the bar by bending at the hips. In the trial above, participants bent from upright to about 90° at the hip [1].
  - Stand back up by driving your hips forward, keeping the bar close to your legs.
alternatives: [hip-thrust, nordic-hamstring-curl, seated-leg-curl]
checked: 2026-10-16
references:
  - text: "Morin T, Doguet V, Nordez A, Caillet A, Lacourpaille L. Minimal role of hamstring hypertrophy in strength transfer between Nordic hamstring and stiff-leg deadlift: a blinded randomized controlled trial. J Strength Cond Res, 2025;39(9):924-932."
    url: "https://doi.org/10.1519/JSC.0000000000005159"
    status: checked
aiAssisted: true
