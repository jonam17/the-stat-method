  - text: "Calatayud J, Borreani S, Colado JC, Martin F, Tella V, Andersen LL. Bench press and push-up at comparable levels of muscle activity results in similar strength gains. J Strength Cond Res, 2015;29(1):246-253."
    url: "https://doi.org/10.1519/JSC.0000000000000589"
