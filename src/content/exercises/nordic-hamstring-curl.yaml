# Hamstrings and glutes · Nordic hamstring curl. Sources read 2026-10-15 — see
# docs/citation-reviews/exercises-hamstrings-glutes.md.
name: Nordic hamstring curl
group: hamstrings-glutes
dek: Needs only something to hold your ankles. In trials with groups that did not train, it grew the hamstrings, most of all the semitendinosus.
primary: [Hamstrings]
equipment: [bodyweight]
progressionClass: isolation
whyHere: >-
  The Nordic curl lowers your body forward from a kneeling position while the hamstrings brake the fall,
  with nothing but your ankles held. In MRI trials against groups that did not train, it grew the hamstrings by
  about 11% in twelve weeks [1] and grew the semitendinosus in ten [2]. Its growth is uneven: it favours
  the semitendinosus, and a hip-bent curl grew the biceps femoris long head several times more [1].
evidence:
  - kind: training
    claim: >-
      Forty-two young men trained for twelve weeks (34 sessions) with Nordic curls, a hip-bent weight-stack
      curl with the lowering emphasised, or no training. Nordic curls grew the hamstrings by 11% and the
      biceps femoris long head by 5%, against 18% and 19% for the hip-bent curl; the untrained group did
      not change. In the knee-bending muscles that do not also extend the hip, Nordic curls produced about
      twice the growth of the hip-bent curl [1].
  - kind: training
    claim: >-
      Thirty recreationally active men did ten weeks of Nordic curls, hip extensions, or no training.
      Both exercises grew the semitendinosus compared with no training, by similar amounts; hip extensions
      grew the biceps femoris long head more than Nordic curls did [2].
  - kind: training
    claim: >-
      In a blinded randomised trial of thirty-six adults without resistance-training experience, nine
      weeks of Nordic curls grew hamstring volume by about 11% — the semitendinosus by about 24% — where a
      third group did not train [3].
howTo:
  - Kneel on a pad with your ankles held down by a partner, a bench or a Nordic machine, and your body upright from knees to head.
  - Keeping your hips straight, lower your body forward as slowly as you can, braking with your hamstrings.
  - Catch yourself with your hands when you can no longer hold the descent, and push back up to the start.
  - The movement is very hard at first; lowering only partway, or using a machine with a counterweight as one trial did [3], makes it easier.
alternatives: [seated-leg-curl, lying-leg-curl, stiff-leg-deadlift]
