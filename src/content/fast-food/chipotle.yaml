# Figures copied by script from Chipotle's U.S. Nutrition Facts paper menu (PDF supplied by the maintainer,
# file "US-Nutrition-Facts-Paper-Menu-3-2025", pages coded OCT-2024; no newer U.S. guide found on 2026-11-21),
# read in full and cross-checked line by line. Chipotle lists ingredients, not finished meals, so this page is
# a builder. The Bowl choice adds nothing; taco choices are three of the listed single tortillas (count: 3).
draft: false
name: "Chipotle"
source:
  title: "Chipotle U.S. Nutrition Facts"
  url: https://www.chipotle.com/nutrition-calculator
  checked: 2026-11-21
  edition: "March 2025"
note: "Chipotle gives figures per ingredient, so the order builder adds up the ones you choose; the totals are our sums of Chipotle's figures. Chips, sides, kids' meals and drinks are not listed here."
builder:
  groups:
    - key: base
      label: "Base"
      pick: one
      items:
        - { name: "Bowl (no tortilla)", portion: "", kcal: 0, protein: 0, carbs: 0, fat: 0, start: 1 }
        - { name: "Burrito: flour tortilla", portion: "1 ea", kcal: 320, protein: 8, carbs: 50, fat: 9 }
        - { name: "Salad: Supergreens salad mix", portion: "3 oz", kcal: 15, protein: 1, carbs: 3, fat: 0 }
        - { name: "Tacos: 3 crispy corn tortillas", portion: "1 ea", kcal: 70, protein: 1, carbs: 10, fat: 3, count: 3 }
        - { name: "Tacos: 3 soft flour tortillas", portion: "1 ea", kcal: 80, protein: 2, carbs: 13, fat: 2.5, count: 3 }
    - key: rice
      label: "Rice"
      pick: many
