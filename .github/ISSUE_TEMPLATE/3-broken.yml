name: Something broken
description: A tool errors, a page renders badly, or a link goes nowhere.
title: "[Broken] "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes: { label: Page address }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened }
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Safari on iPhone
